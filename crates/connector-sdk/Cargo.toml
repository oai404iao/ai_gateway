[package]
name = "ai-gateway-connector-sdk"
version = "0.2.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "Versioned C ABI for ai-gateway native connector plugins"
repository = "https://github.com/oai404iao/ai_gateway"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1.8"

[[example]]
name = "responses"
crate-type = ["cdylib"]
test = true

[[example]]
name = "response_adapter"
crate-type = ["cdylib"]
test = true
