[package]
name = "ai-gateway-perf"
version = "0.1.2"
edition = "2024"
rust-version = "1.85"
publish = false
description = "Manually invoked end-to-end forwarding performance harness for ai-gateway"
license = "AGPL-3.0-only"

[dependencies]
ai-gateway = { path = "../.." }
arc-swap = "1.7"
axum = "0.8"
bytes = "1.10"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", default-features = false, features = ["chrono", "postgres", "runtime-tokio-rustls", "uuid"] }
tokio = { version = "1.43", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.8"
uuid = { version = "1.11", features = ["serde", "v4"] }
