version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Etc/UTC
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action/*"
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
