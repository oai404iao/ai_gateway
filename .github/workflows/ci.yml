name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: ai_gateway
          POSTGRES_PASSWORD: ci-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ai_gateway -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_ADMIN_URL: postgres://ai_gateway:ci-test-password@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets
      - run: cargo test

  console:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
          run_install: false
      - run: pnpm --dir web/console install --frozen-lockfile
      - run: pnpm --dir web/console generate:api:check
      - run: pnpm --dir web/console typecheck
      - run: pnpm --dir web/console lint
      - run: pnpm --dir web/console test
      - run: pnpm --dir web/console build

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs:
      - rust
      - console
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: ai-gateway:ci
          cache-from: type=gha,scope=ci-image
          cache-to: type=gha,mode=max,scope=ci-image
          build-args: |
            VERSION=ci
            REVISION=${{ github.sha }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
      - run: docker run --rm ai-gateway:ci --version
