name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      docs: ${{ steps.areas.outputs.docs }}
      rust: ${{ steps.areas.outputs.rust }}
      console: ${{ steps.areas.outputs.console }}
      image: ${{ steps.areas.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Test changed-area classifier
        run: scripts/test-ci-changed-areas.sh
      - name: Test release automation
        run: scripts/test-release-automation.sh
      - name: Resolve changed files
        id: areas
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == pull_request ]]; then
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
          else
            base="$PUSH_BASE_SHA"
            head="$PUSH_HEAD_SHA"
          fi

          if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            git ls-files > /tmp/changed-files
          else
            git diff --check "$base" "$head" --
            git diff --name-only "$base" "$head" -- > /tmp/changed-files
          fi

          scripts/ci-changed-areas.sh < /tmp/changed-files | tee -a "$GITHUB_OUTPUT"

          {
            echo "### Changed files"
            echo
            sed 's/^/- `/' /tmp/changed-files | sed 's/$/`/'
          } >> "$GITHUB_STEP_SUMMARY"

  quality:
    name: quality
    needs: changes
    uses: ./.github/workflows/reusable-quality.yml
    with:
      run_docs: ${{ needs.changes.outputs.docs == 'true' }}
      run_rust: ${{ needs.changes.outputs.rust == 'true' }}
      run_msrv: ${{ needs.changes.outputs.rust == 'true' }}
      run_console: ${{ needs.changes.outputs.console == 'true' }}
      run_e2e: ${{ needs.changes.outputs.console == 'true' }}
      save_cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

  dependency-review:
    name: dependency-review
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          retry-on-snapshot-warnings: true
          show-patched-versions: true

  image:
    name: image
    if: ${{ needs.changes.outputs.image == 'true' }}
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      DOCKER_BUILD_RECORD_UPLOAD: "false"
      CACHE_TO: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'type=gha,mode=max,scope=ci-image-amd64' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: ai-gateway:ci
          cache-from: |
            type=gha,scope=ci-image-amd64
            type=gha,scope=release-image-amd64
          cache-to: ${{ env.CACHE_TO }}
          build-args: |
            VERSION=ci
            REVISION=${{ github.sha }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
      - run: docker run --rm ai-gateway:ci --version

  ci-gate:
    name: ci-gate
    if: ${{ always() }}
    needs:
      - changes
      - quality
      - dependency-review
      - image
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CHANGES_RESULT: ${{ needs.changes.result }}
      QUALITY_RESULT: ${{ needs.quality.result }}
      DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
      IMAGE_RESULT: ${{ needs.image.result }}
    steps:
      - name: Evaluate CI
        shell: bash
        run: |
          failed=false
          for result in \
            "$CHANGES_RESULT" \
            "$QUALITY_RESULT" \
            "$DEPENDENCY_REVIEW_RESULT" \
            "$IMAGE_RESULT"
          do
            case "$result" in
              success | skipped)
                ;;
              *)
                failed=true
                ;;
            esac
          done

          if [[ "$failed" == true ]]; then
            echo "::error::One or more required CI jobs did not succeed"
            exit 1
          fi
