name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: ai_gateway
          POSTGRES_PASSWORD: release-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ai_gateway -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_ADMIN_URL: postgres://ai_gateway:release-test-password@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.17.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/console/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.92.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Validate release version
        run: ./scripts/check-release-version.sh "${GITHUB_REF_NAME}"
      - run: cargo fmt --check
      - run: cargo clippy --locked --workspace --all-targets
      - run: cargo test --locked --workspace
      - run: pnpm --dir web/console install --frozen-lockfile
      - run: pnpm --dir web/console generate:api:check
      - run: pnpm --dir web/console typecheck
      - run: pnpm --dir web/console lint
      - run: pnpm --dir web/console test
      - run: pnpm --dir web/console build
      - run: cargo clippy --locked --all-targets --features embedded-console-ui
      - run: cargo test --locked --features embedded-console-ui --lib console_ui
      - run: cargo build --locked --release --features embedded-console-ui

      - name: Package release assets
        run: |
          version="${GITHUB_REF_NAME#v}"
          ./scripts/package-release.sh "$version"
          ./scripts/release-notes.sh "$version" > target/release-package/RELEASE_NOTES.md

      - name: Upload release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: target/release-package/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish-platform-images:
    name: publish-platform-image (${{ matrix.arch }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ghcr.io/oai404iao/ai_gateway
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=false
          labels: |
            org.opencontainers.image.licenses=AGPL-3.0-only
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=semver,pattern={{major}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and publish platform image
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: |
            type=gha,scope=ci-image-${{ matrix.arch }}
            type=gha,scope=release-image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-image-${{ matrix.arch }}
          build-args: |
            VERSION=${{ steps.metadata.outputs.version }}
            REVISION=${{ github.sha }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}

      - name: Export image digest
        shell: bash
        run: |
          digest="${{ steps.image.outputs.digest }}"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Unexpected image digest: $digest"
            exit 1
          fi
          mkdir -p /tmp/digests
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload image digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish-image:
    needs: publish-platform-images
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE_NAME: ghcr.io/oai404iao/ai_gateway
    steps:
      - name: Download image digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: image-digest-*
          path: /tmp/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=false
          labels: |
            org.opencontainers.image.licenses=AGPL-3.0-only
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=semver,pattern={{major}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Create multi-platform image
        id: image
        working-directory: /tmp/digests
        shell: bash
        run: |
          mapfile -t tags < <(jq -r '.tags[]' <<<"$DOCKER_METADATA_OUTPUT_JSON")
          if (( ${#tags[@]} == 0 )); then
            echo "::error::No image tags were generated"
            exit 1
          fi

          args=()
          for tag in "${tags[@]}"; do
            args+=("-t" "$tag")
          done

          shopt -s nullglob
          digest_files=(*)
          if (( ${#digest_files[@]} != 2 )); then
            echo "::error::Expected 2 platform digests, found ${#digest_files[@]}"
            exit 1
          fi
          for digest in "${digest_files[@]}"; do
            if [[ ! "$digest" =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::Unexpected digest filename: $digest"
              exit 1
            fi
            args+=("${IMAGE_NAME}@sha256:${digest}")
          done

          docker buildx imagetools create "${args[@]}"

          inspect="$(docker buildx imagetools inspect "${tags[0]}")"
          printf '%s\n' "$inspect"
          digest="$(awk '$1 == "Digest:" { print $2; exit }' <<<"$inspect")"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Unable to resolve multi-platform image digest"
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest public image provenance
        if: ${{ github.event.repository.private == false }}
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

  publish-release:
    needs:
      - verify
      - publish-image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: target/release-package
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          ./scripts/publish-github-release.sh \
            "$GITHUB_REF_NAME" \
            target/release-package/RELEASE_NOTES.md \
            target/release-package/*.tar.gz \
            target/release-package/SHA256SUMS
