name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  actions: read
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify tag target
        shell: bash
        run: |
          if [[ "$(git cat-file -t "$GITHUB_REF_NAME")" != tag ]]; then
            echo "::error::Release refs must be annotated tags"
            exit 1
          fi
          tag_target="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          if [[ "$tag_target" != "$GITHUB_SHA" ]]; then
            echo "::error::Tag target $tag_target does not match workflow SHA $GITHUB_SHA"
            exit 1
          fi
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor \
            "$GITHUB_SHA" refs/remotes/origin/main
          then
            echo "::error::Release tag target is not part of main"
            exit 1
          fi

      - name: Resolve version
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Validate release version
        run: ./scripts/check-release-version.sh "$GITHUB_REF_NAME"

      - name: Require successful main CI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: ./scripts/require-successful-main-ci.sh "$GITHUB_SHA" --wait-seconds 300

  verify:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.17.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Resolve pnpm store
        id: pnpm_store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Restore pnpm store
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm_store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('web/console/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-${{ runner.arch }}-
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: stable
          save-if: false

      - run: pnpm --dir web/console install --frozen-lockfile
      - run: pnpm --dir web/console build
      - run: cargo clippy --locked --all-targets --features embedded-console-ui
      - run: cargo test --locked --features embedded-console-ui --lib console_ui

  publish-platform-images:
    name: publish-platform-image (${{ matrix.arch }})
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
            cache_scope: ci-image-amd64
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            cache_scope: release-image-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ghcr.io/oai404iao/ai_gateway
      VERSION: ${{ needs.preflight.outputs.version }}
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=false
          labels: |
            org.opencontainers.image.licenses=AGPL-3.0-only
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=semver,pattern={{major}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and publish platform image
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          build-args: |
            VERSION=${{ env.VERSION }}
            REVISION=${{ github.sha }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}

      - name: Export image digest
        shell: bash
        run: |
          digest="${{ steps.image.outputs.digest }}"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Unexpected image digest: $digest"
            exit 1
          fi
          mkdir -p /tmp/digests
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload image digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Extract and verify release binary
        if: ${{ matrix.arch == 'amd64' }}
        shell: bash
        run: |
          digest="${{ steps.image.outputs.digest }}"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Unexpected AMD64 image digest: $digest"
            exit 1
          fi
          image="${IMAGE_NAME}@${digest}"
          docker pull --platform linux/amd64 "$image"
          docker run --rm "$image" --version | grep -Fx "ai-gateway ${VERSION}"
          docker image inspect \
            --format '{{ index .Config.Labels "org.opencontainers.image.licenses" }}' \
            "$image" \
            | grep -Fx "AGPL-3.0-only"

          container="$(docker create "$image")"
          cleanup() {
            docker rm -f "$container" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          mkdir -p target/release target/image-license-materials
          docker cp "$container:/usr/local/bin/ai-gateway" target/release/ai-gateway
          docker cp \
            "$container:/usr/share/doc/ai-gateway/." \
            target/image-license-materials
          cleanup
          trap - EXIT

          chmod 0755 target/release/ai-gateway
          test -s target/image-license-materials/THIRD_PARTY_NOTICES.md
          test -d target/image-license-materials/LICENSES

      - name: Package release assets
        if: ${{ matrix.arch == 'amd64' }}
        shell: bash
        run: |
          RELEASE_BINARY=target/release/ai-gateway \
          RELEASE_LICENSE_MATERIALS=target/image-license-materials \
          RELEASE_TARGET=x86_64-unknown-linux-gnu \
            ./scripts/package-release.sh "$VERSION"
          ./scripts/release-notes.sh "$VERSION" \
            > target/release-package/RELEASE_NOTES.md

      - name: Upload release assets
        if: ${{ matrix.arch == 'amd64' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: target/release-package/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish-image:
    needs:
      - preflight
      - verify
      - publish-platform-images
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE_NAME: ghcr.io/oai404iao/ai_gateway
    steps:
      - name: Download image digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: image-digest-*
          path: /tmp/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=false
          labels: |
            org.opencontainers.image.licenses=AGPL-3.0-only
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=semver,pattern={{major}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Create multi-platform image
        id: image
        working-directory: /tmp/digests
        shell: bash
        run: |
          mapfile -t tags < <(jq -r '.tags[]' <<<"$DOCKER_METADATA_OUTPUT_JSON")
          if (( ${#tags[@]} == 0 )); then
            echo "::error::No image tags were generated"
            exit 1
          fi

          args=()
          for tag in "${tags[@]}"; do
            args+=("-t" "$tag")
          done

          shopt -s nullglob
          digest_files=(*)
          if (( ${#digest_files[@]} != 2 )); then
            echo "::error::Expected 2 platform digests, found ${#digest_files[@]}"
            exit 1
          fi
          for digest in "${digest_files[@]}"; do
            if [[ ! "$digest" =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::Unexpected digest filename: $digest"
              exit 1
            fi
            args+=("${IMAGE_NAME}@sha256:${digest}")
          done

          docker buildx imagetools create "${args[@]}"

          inspect="$(docker buildx imagetools inspect "${tags[0]}")"
          printf '%s\n' "$inspect"
          digest="$(awk '$1 == "Digest:" { print $2; exit }' <<<"$inspect")"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Unable to resolve multi-platform image digest"
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest public image provenance
        if: ${{ github.event.repository.private == false }}
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

  publish-release:
    needs: publish-image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: target/release-package
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          ./scripts/publish-github-release.sh \
            "$GITHUB_REF_NAME" \
            target/release-package/RELEASE_NOTES.md \
            target/release-package/*.tar.gz \
            target/release-package/SHA256SUMS
