name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: ai_gateway
          POSTGRES_PASSWORD: release-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ai_gateway -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_ADMIN_URL: postgres://ai_gateway:release-test-password@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
          run_install: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Validate release version
        run: ./scripts/check-release-version.sh "${GITHUB_REF_NAME}"
      - run: cargo fmt --check
      - run: cargo clippy --all-targets
      - run: cargo test
      - run: pnpm --dir web/console install --frozen-lockfile
      - run: pnpm --dir web/console generate:api:check
      - run: pnpm --dir web/console typecheck
      - run: pnpm --dir web/console lint
      - run: pnpm --dir web/console test
      - run: pnpm --dir web/console build
      - run: cargo clippy --all-targets --features embedded-console-ui
      - run: cargo test --features embedded-console-ui --lib console_ui
      - run: cargo build --locked --release --features embedded-console-ui

      - name: Package release assets
        run: |
          version="${GITHUB_REF_NAME#v}"
          ./scripts/package-release.sh "$version"
          ./scripts/release-notes.sh "$version" > target/release-package/RELEASE_NOTES.md

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tags=(--tag "${image}:${version}")

          if [[ "$version" != *-* ]]; then
            major="${version%%.*}"
            remainder="${version#*.}"
            minor="${remainder%%.*}"
            tags+=(
              --tag "${image}:${major}.${minor}"
              --tag "${image}:${major}"
              --tag "${image}:latest"
            )
          fi

          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --push \
            --cache-from type=gha,scope=release-image \
            --cache-to type=gha,mode=max,scope=release-image \
            "${tags[@]}" \
            --build-arg "VERSION=${version}" \
            --build-arg "REVISION=${GITHUB_SHA}" \
            --build-arg "SOURCE_URL=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            .

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          ./scripts/publish-github-release.sh \
            "$GITHUB_REF_NAME" \
            target/release-package/RELEASE_NOTES.md \
            target/release-package/*.tar.gz \
            target/release-package/SHA256SUMS
