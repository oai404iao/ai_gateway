name: Release image cache

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      image: ${{ steps.areas.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Resolve changed files
        id: areas
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == workflow_dispatch ]] \
            || [[ -z "$PUSH_BASE_SHA" || "$PUSH_BASE_SHA" =~ ^0+$ ]] \
            || ! git cat-file -e "${PUSH_BASE_SHA}^{commit}" 2>/dev/null
          then
            git ls-files > /tmp/changed-files
          else
            git diff --name-only "$PUSH_BASE_SHA" "$PUSH_HEAD_SHA" -- \
              > /tmp/changed-files
          fi
          scripts/ci-changed-areas.sh < /tmp/changed-files | tee -a "$GITHUB_OUTPUT"

  warm-arm64:
    if: ${{ needs.changes.outputs.image == 'true' && github.ref == 'refs/heads/main' }}
    needs: changes
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    concurrency:
      group: release-image-cache-arm64
      cancel-in-progress: true
    env:
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Resolve version
        id: version
        shell: bash
        run: |
          version="$(
            python3 -c \
              'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])'
          )"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Warm ARM64 release image cache
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/arm64
          push: false
          cache-from: type=gha,scope=release-image-arm64
          cache-to: type=gha,mode=max,scope=release-image-arm64
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            REVISION=${{ github.sha }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
