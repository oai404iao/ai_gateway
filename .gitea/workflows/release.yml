name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: ai_gateway
          POSTGRES_PASSWORD: release-test-password
        options: >-
          --health-cmd "pg_isready -U ai_gateway -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_ADMIN_URL: postgres://ai_gateway:release-test-password@postgres:5432/postgres
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Validate release version
        run: ./scripts/check-release-version.sh "${GITHUB_REF_NAME}"
      - run: cargo fmt --check
      - run: cargo clippy --all-targets
      - run: cargo test
      - run: pnpm --dir web/console install --frozen-lockfile
      - run: pnpm --dir web/console generate:api:check
      - run: pnpm --dir web/console typecheck
      - run: pnpm --dir web/console lint
      - run: pnpm --dir web/console test
      - run: pnpm --dir web/console build
      - run: cargo clippy --all-targets --features embedded-console-ui
      - run: cargo test --features embedded-console-ui --lib console_ui
      - run: cargo build --locked --release --features embedded-console-ui

      - name: Package release assets
        run: |
          version="${GITHUB_REF_NAME#v}"
          ./scripts/package-release.sh "$version"
          ./scripts/release-notes.sh "$version" > target/release-package/RELEASE_NOTES.md

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build and optionally publish image
        env:
          GITEA_SERVER_URL: ${{ gitea.server_url }}
          GITEA_REPOSITORY: ${{ gitea.repository }}
          GITEA_SHA: ${{ gitea.sha }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          registry="${GITEA_SERVER_URL#https://}"
          registry="${registry#http://}"
          image="${registry}/${GITEA_REPOSITORY}"
          tags=(--tag "${image}:${version}")

          if [[ "$version" != *-* ]]; then
            major="${version%%.*}"
            remainder="${version#*.}"
            minor="${remainder%%.*}"
            tags+=(
              --tag "${image}:${major}.${minor}"
              --tag "${image}:${major}"
              --tag "${image}:latest"
            )
          fi

          if [[ -n "$REGISTRY_USERNAME" && -n "$REGISTRY_TOKEN" ]]; then
            printf '%s' "$REGISTRY_TOKEN" |
              docker login "$registry" \
                --username "$REGISTRY_USERNAME" \
                --password-stdin
            docker buildx build \
              --platform linux/amd64,linux/arm64 \
              --push \
              "${tags[@]}" \
              --build-arg "VERSION=${version}" \
              --build-arg "REVISION=${GITEA_SHA}" \
              --build-arg "SOURCE_URL=${GITEA_SERVER_URL}/${GITEA_REPOSITORY}" \
              .
          else
            echo "::warning::REGISTRY_USERNAME/REGISTRY_TOKEN are unset; image will not be pushed"
            docker buildx build \
              --platform linux/amd64 \
              --load \
              "${tags[@]}" \
              --build-arg "VERSION=${version}" \
              --build-arg "REVISION=${GITEA_SHA}" \
              --build-arg "SOURCE_URL=${GITEA_SERVER_URL}/${GITEA_REPOSITORY}" \
              .
          fi

      - name: Publish Gitea release
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          GITEA_API_URL: ${{ gitea.api_url }}
          GITEA_REPOSITORY: ${{ gitea.repository }}
          GITEA_SHA: ${{ gitea.sha }}
        run: |
          ./scripts/publish-gitea-release.sh \
            "$GITHUB_REF_NAME" \
            target/release-package/RELEASE_NOTES.md \
            target/release-package/*.tar.gz \
            target/release-package/SHA256SUMS
