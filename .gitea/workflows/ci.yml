name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: ai_gateway
          POSTGRES_PASSWORD: ci-test-password
        options: >-
          --health-cmd "pg_isready -U ai_gateway -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_ADMIN_URL: postgres://ai_gateway:ci-test-password@postgres:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets
      - run: cargo test

  console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false
      - run: pnpm --dir web/console install --frozen-lockfile
      - run: pnpm --dir web/console generate:api:check
      - run: pnpm --dir web/console typecheck
      - run: pnpm --dir web/console lint
      - run: pnpm --dir web/console test
      - run: pnpm --dir web/console build

  image:
    runs-on: ubuntu-latest
    needs:
      - rust
      - console
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ai-gateway:ci
          build-args: |
            VERSION=ci
            REVISION=${{ gitea.sha }}
            SOURCE_URL=${{ gitea.server_url }}/${{ gitea.repository }}
      - run: docker run --rm ai-gateway:ci --version
