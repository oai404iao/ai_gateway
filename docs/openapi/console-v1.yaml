    CodexQuotaWindowKind:
      type: string
      enum: [primary, secondary]

    CodexQuotaResetReason:
      type: string
      enum: [natural, manual, openai_official]
      description: |
        `natural` means the next observed period began at or after the prior
        scheduled reset. `manual` means a reset credit consumed through this
        Console was matched to the rollover. `openai_official` means the
        provider began a new period before the scheduled reset without a
        matching Console reset-credit event.

    CodexQuotaWindowPeriod:
      type: object
      required:
        [id, credential_id, window_kind, window_seconds, started_at,
         scheduled_reset_at, ended_at, reset_reason, initial_used_percent,
         last_used_percent, first_observed_at, last_observed_at]
      properties:
        id: { type: string, format: uuid }
        credential_id: { type: string, format: uuid }
        window_kind: { $ref: "#/components/schemas/CodexQuotaWindowKind" }
        window_seconds: { type: integer, minimum: 1 }
        started_at: { $ref: "#/components/schemas/DateTime" }
        scheduled_reset_at: { $ref: "#/components/schemas/DateTime" }
        ended_at: { $ref: "#/components/schemas/DateTimeNullable" }
        reset_reason:
          allOf: [{ $ref: "#/components/schemas/CodexQuotaResetReason" }]
          nullable: true
          description: Null only for the current observed period.
        initial_used_percent: { type: integer, minimum: 0, maximum: 100 }
        last_used_percent: { type: integer, minimum: 0, maximum: 100 }
        first_observed_at: { $ref: "#/components/schemas/DateTime" }
        last_observed_at: { $ref: "#/components/schemas/DateTime" }

    CodexQuotaWindowHistory:
      type: object
      required: [credential_id, periods]
      properties:
        credential_id: { type: string, format: uuid }
        periods:
          type: array
          items: { $ref: "#/components/schemas/CodexQuotaWindowPeriod" }

    SelfCodexQuotaCredentialView:
      type: object
      description: |
        Sanitized, read-only Codex quota snapshot. The stored credential
        label and account identity are deliberately omitted.
      required:
        [id, name, channel_group_id, plan_type, primary_used_percent,
         primary_window_seconds, primary_reset_at, secondary_used_percent,
         secondary_window_seconds, secondary_reset_at, quota_checked_at]
      properties:
        id: { type: string, format: uuid }
        name:
          type: string
          description: Credential UUID rendered as a name; never the administrator label.
        channel_group_id:
          type: string
          format: uuid
          description: Canonical Codex OAuth Responses channel group granting visibility.
        plan_type:
          type: string
          nullable: true
          description: Provider-reported subscription tier.
        primary_used_percent: { type: integer, minimum: 0, maximum: 100, nullable: true }
        primary_window_seconds: { type: integer, minimum: 1, nullable: true }
        primary_reset_at: { $ref: "#/components/schemas/DateTimeNullable" }
        secondary_used_percent: { type: integer, minimum: 0, maximum: 100, nullable: true }
        secondary_window_seconds: { type: integer, minimum: 1, nullable: true }
        secondary_reset_at: { $ref: "#/components/schemas/DateTimeNullable" }
        quota_checked_at: { $ref: "#/components/schemas/DateTimeNullable" }

    SelfCodexQuotaWindowPeriod:
      type: object
      description: Sanitized quota-window period without internal row identifiers.
      required:
        [window_kind, window_seconds, started_at, scheduled_reset_at, ended_at,
         reset_reason, initial_used_percent, last_used_percent,
         first_observed_at, last_observed_at]
      properties:
        window_kind: { $ref: "#/components/schemas/CodexQuotaWindowKind" }
        window_seconds: { type: integer, minimum: 1 }
        started_at: { $ref: "#/components/schemas/DateTime" }
        scheduled_reset_at: { $ref: "#/components/schemas/DateTime" }
        ended_at: { $ref: "#/components/schemas/DateTimeNullable" }
        reset_reason:
          allOf: [{ $ref: "#/components/schemas/CodexQuotaResetReason" }]
          nullable: true
        initial_used_percent: { type: integer, minimum: 0, maximum: 100 }
        last_used_percent: { type: integer, minimum: 0, maximum: 100 }
        first_observed_at: { $ref: "#/components/schemas/DateTime" }
        last_observed_at: { $ref: "#/components/schemas/DateTime" }

    SelfCodexQuotaWindowHistory:
      type: object
      required: [credential_id, name, channel_group_id, plan_type, periods]
      properties:
        credential_id: { type: string, format: uuid }
        name:
          type: string
          description: Credential UUID rendered as a name; never the administrator label.
        channel_group_id: { type: string, format: uuid }
        plan_type: { type: string, nullable: true }
        periods:
          type: array
          items: { $ref: "#/components/schemas/SelfCodexQuotaWindowPeriod" }

    CodexQuotaResetOutcome:
      type: string
      enum: [reset, nothing_to_reset, no_credit, already_redeemed]

    CodexQuotaResetResponse:
      type: object
      required: [outcome, windows_reset, quota_refreshed, correlation_id]
      properties:
        outcome: { $ref: "#/components/schemas/CodexQuotaResetOutcome" }
        windows_reset:
          type: integer
          minimum: 0
          maximum: 2
        quota_refreshed:
          type: boolean
          description: Whether the immediate follow-up usage refresh succeeded.
        correlation_id: { type: string, format: uuid }

    CodexCredentialSettings:
      type: object
      required: [label]
      properties:
        label: { type: string, minLength: 1, maxLength: 100 }
        proxy_id: { type: string, format: uuid, nullable: true }
        weight: { type: integer, minimum: 1, default: 100 }
        quota_threshold_percent:
          type: integer
          minimum: 1
          maximum: 100
          default: 95

    CodexOauthStartInput:
      allOf:
        - $ref: "#/components/schemas/CodexCredentialSettings"

    CodexOauthStartResponse:
      type: object
      required: [flow_id, authorization_url, expires_at]
      properties:
        flow_id: { type: string, format: uuid }
        authorization_url: { type: string, format: uri }
        expires_at: { $ref: "#/components/schemas/DateTime" }

    CodexOauthCompleteInput:
      type: object
      required: [callback_url]
      properties:
        callback_url:
          type: string
          format: uri
          description: Full `http://localhost:1455/auth/callback?...` URL copied after browser authorization.

    CodexCredentialImportInput:
      allOf:
        - $ref: "#/components/schemas/CodexCredentialSettings"
        - type: object
          required: [access_token, refresh_token]
          properties:
            enabled:
              type: boolean
              default: true
            id_token:
              type: string
              minLength: 1
              writeOnly: true
              description: Optional ID token. When omitted, identity claims are read from the access token.
            access_token: { type: string, minLength: 1, writeOnly: true }
            refresh_token: { type: string, minLength: 1, writeOnly: true }
            account_id:
              type: string
              maxLength: 300
              nullable: true
              description: Optional workspace fallback. Personal credentials may omit it; mismatches are rejected.
            user_id:
              type: string
              maxLength: 300
              nullable: true
              description: Optional user fallback. Accountless credentials require a token or override user ID; mismatches are rejected.

    CodexCredentialExportInput:
      type: object
      properties:
        credential_ids:
          type: array
          maxItems: 1000
          uniqueItems: true
          default: []
          description: Empty exports every credential in the connector group.
          items: { type: string, format: uuid }
        include_proxies:
          type: boolean
          default: true

    CodexCredentialExportBundle:
      type: object
      required:
        [type, version, exported_at, channel_group_id, channel_group_name,
         proxies, credentials]
      properties:
        type:
          type: string
          enum: [ai-gateway-codex-credentials]
        version: { type: integer, enum: [1] }
        exported_at: { $ref: "#/components/schemas/DateTime" }
        channel_group_id: { type: string, format: uuid }
        channel_group_name: { type: string }
        proxies:
          type: array
          items: { $ref: "#/components/schemas/CodexCredentialExportProxy" }
        credentials:
          type: array
          items: { $ref: "#/components/schemas/CodexCredentialExportItem" }

    CodexCredentialExportProxy:
      type: object
      required:
        [proxy_key, name, proxy_url, username, password, no_proxy_hosts, enabled]
      properties:
        proxy_key: { type: string, format: uuid }
        name: { type: string }
        proxy_url: { type: string }
        username: { type: string, nullable: true }
        password: { type: string, nullable: true }
        no_proxy_hosts:
          type: array
          items: { type: string }
        enabled: { type: boolean }

    CodexCredentialExportItem:
      type: object
      required:
        [label, email, account_id, user_id, plan_type, is_fedramp, id_token,
         access_token, refresh_token, proxy_key, weight,
         quota_threshold_percent, enabled]
      properties:
        label: { type: string }
        email: { type: string, nullable: true }
        account_id:
          type: string
          nullable: true
        user_id: { type: string, nullable: true }
        plan_type: { type: string, nullable: true }
        is_fedramp: { type: boolean }
        id_token: { type: string }
        access_token: { type: string }
        refresh_token: { type: string }
        proxy_key: { type: string, format: uuid, nullable: true }
        weight: { type: integer, minimum: 1 }
        quota_threshold_percent: { type: integer, minimum: 1, maximum: 100 }
        enabled: { type: boolean }

    CodexCredentialUpdateInput:
      type: object
      required: [label, enabled, proxy_id, weight, quota_threshold_percent]
      properties:
        label: { type: string, minLength: 1, maxLength: 100 }
        enabled: { type: boolean }
        proxy_id: { type: string, format: uuid, nullable: true }
        weight: { type: integer, minimum: 1 }
        quota_threshold_percent: { type: integer, minimum: 1, maximum: 100 }

    CodexCredentialBatchOperation:
      type: string
      enum: [enable, disable, delete]

    CodexCredentialBatchTarget:
      type: object
      required: [id, updated_at]
      properties:
        id: { type: string, format: uuid }
        updated_at:
          allOf: [{ $ref: "#/components/schemas/DateTime" }]
          description: Version copied from the credential list response.

    CodexCredentialBatchInput:
      type: object
      required: [items, operation]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: { $ref: "#/components/schemas/CodexCredentialBatchTarget" }
        operation: { $ref: "#/components/schemas/CodexCredentialBatchOperation" }

    CodexCredentialBatchResponse:
      type: object
      required: [updated_ids, correlation_id]
      properties:
        updated_ids:
          type: array
          items: { type: string, format: uuid }
        correlation_id: { type: string, format: uuid }

    ModelRuleView:
      type: object
      required:
        [id, client_model, api_format, upstream_model_id, upstream_model_enabled, upstream_model,
         description, channel_group_ids, channel_ids, enabled, updated_at]
      properties:
        id: { type: string, format: uuid }
        client_model: { type: string }
        api_format: { $ref: "#/components/schemas/ApiFormat" }
        upstream_model_id: { type: string, format: uuid }
        upstream_model_enabled: { type: boolean }
        upstream_model: { type: string }
        description: { type: string, nullable: true }
        channel_group_ids:
          type: array
          items: { type: string, format: uuid }
        channel_ids:
          type: array
          items: { type: string, format: uuid }
        enabled: { type: boolean }
        updated_at: { $ref: "#/components/schemas/DateTime" }

    ProxyView:
      type: object
      required: [id, name, proxy_url, no_proxy_hosts, enabled, credential_configured, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        proxy_url: { type: string }
        no_proxy_hosts:
          type: array
          items: { type: string }
        enabled: { type: boolean }
        credential_configured: { type: boolean }
        created_at: { $ref: "#/components/schemas/DateTime" }
        updated_at: { $ref: "#/components/schemas/DateTime" }

    ProxyTestResponse:
      type: object
      required:
        [ip, continent, continent_code, country, country_code, region_code, region_name,
         city, district, postal_code, latitude, longitude, timezone, utc_offset_seconds,
         currency, isp, organization, autonomous_system, autonomous_system_name, mobile,
         proxy, hosting, latency_ms, rate_limit_remaining, rate_limit_reset_seconds]
      properties:
        ip: { type: string }
        continent: { type: string, nullable: true }
        continent_code: { type: string, nullable: true }
        country: { type: string, nullable: true }
        country_code: { type: string, nullable: true }
        region_code: { type: string, nullable: true }
        region_name: { type: string, nullable: true }
        city: { type: string, nullable: true }
        district: { type: string, nullable: true }
        postal_code: { type: string, nullable: true }
        latitude: { type: number, format: double, nullable: true }
        longitude: { type: number, format: double, nullable: true }
        timezone: { type: string, nullable: true }
        utc_offset_seconds: { type: integer, nullable: true }
        currency: { type: string, nullable: true }
        isp: { type: string, nullable: true }
        organization: { type: string, nullable: true }
        autonomous_system: { type: string, nullable: true }
        autonomous_system_name: { type: string, nullable: true }
        mobile: { type: boolean, nullable: true }
        proxy: { type: boolean, nullable: true }
        hosting: { type: boolean, nullable: true }
        latency_ms: { type: integer, format: int64, minimum: 0 }
        rate_limit_remaining: { type: integer, minimum: 0, nullable: true }
        rate_limit_reset_seconds: { type: integer, format: int64, minimum: 0, nullable: true }

    ConfigTemplateView:
      type: object
      required: [id, name, description, api_format, enabled, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string, nullable: true }
        api_format:
          type: string
          enum: [open_ai_chat_completions, open_ai_responses, open_ai_images]
          nullable: true
        enabled: { type: boolean }
        created_at: { $ref: "#/components/schemas/DateTime" }
        updated_at: { $ref: "#/components/schemas/DateTime" }

    ConfigTemplateDetailView:
      allOf:
        - $ref: "#/components/schemas/ConfigTemplateView"
        - type: object
          required: [document]
          properties:
            document:
              allOf: [{ $ref: "#/components/schemas/JsonValue" }]
              description: Stored transform template document returned for administrator editing.

    RequestLogView:
      type: object
      required:
        [id, started_at, completed_at, user_id, user_name, api_key_id, api_format,
         api_operation, request_source, request_protocol, client_model, upstream_model, model_rule_id, channel_group_id,
         channel_group_name, channel_id, channel_name, outcome, response_status_code, streamed, ttft_ms,
         total_duration_ms, output_tokens_per_second, reasoning_effort, fast_mode, input_tokens, cached_input_tokens,
         cache_write_tokens, output_tokens, reasoning_tokens, cost_amount, error_code, error_summary,
         billed_at]
      properties:
        id: { type: string, format: uuid }
        started_at: { $ref: "#/components/schemas/DateTime" }
        completed_at: { $ref: "#/components/schemas/DateTime" }
        user_id: { type: string, format: uuid }
        user_name:
          type: string
          nullable: true
          description: Administrator-only current display name; self-service responses return null.
        api_key_id: { type: string, format: uuid }
        request_source: { $ref: "#/components/schemas/RequestLogSource" }
        api_format: { $ref: "#/components/schemas/ApiFormat" }
        api_operation: { $ref: "#/components/schemas/ApiOperation" }
        request_protocol: { $ref: "#/components/schemas/RequestProtocol" }
        client_model: { type: string }
        reasoning_effort:
          type: string
          maxLength: 32
          nullable: true
          description: Normalized explicit client reasoning effort parsed from reasoning.effort or reasoning_effort.
        fast_mode:
          type: boolean
          description: True when the client explicitly requested service_tier=priority.
        upstream_model: { type: string, nullable: true }
        model_rule_id: { type: string, format: uuid, nullable: true }
        channel_group_id: { type: string, format: uuid, nullable: true }
        channel_group_name:
          type: string
          nullable: true
          description: Current display name of the selected channel group.
        channel_id:
          type: string
          format: uuid
          nullable: true
          description: Administrator-only; all self-service responses return null.
        channel_name:
          type: string
          nullable: true
          description: Administrator-only current display name; all self-service responses return null.
        outcome: { type: string }
        response_status_code: { type: integer, nullable: true }
        streamed:
          type: boolean
          description: Compatibility flag; true for SSE and WebSocket requests.
        ttft_ms: { type: integer, nullable: true }
        total_duration_ms: { type: integer, nullable: true }
        output_tokens_per_second:
          allOf: [{ $ref: "#/components/schemas/DecimalNullable" }]
          description: Output tokens divided by generation time in seconds (total duration minus TTFT).
        input_tokens: { type: integer, nullable: true }
        cached_input_tokens: { type: integer, nullable: true }
        cache_write_tokens: { type: integer, nullable: true }
        output_tokens: { type: integer, nullable: true }
        reasoning_tokens:
          type: integer
          nullable: true
          description: Subset of output_tokens spent on model reasoning, or null when usage is unavailable.
        cost_amount:
          allOf: [{ $ref: "#/components/schemas/DecimalNullable" }]
          description: Final request cost in USD, or null when not priced.
        error_code: { type: string, maxLength: 100, nullable: true }
        error_summary:
          type: string
          maxLength: 1000
          nullable: true
          description: Bounded, cleaned upstream error message when available.
        billed_at: { $ref: "#/components/schemas/DateTimeNullable" }

    RequestLogSource:
      type: string
      enum: [client, scheduled_test]

    RequestProtocol:
      type: string
      enum: [non_stream, sse, websocket]

    PersonalUsageReport:
      type: object
      required:
        [started_on, ended_on, total_request_count, active_day_count,
         current_streak_days, longest_streak_days, days]
      properties:
        started_on:
          type: string
          format: date
          description: Inclusive first UTC date in the 365-day window.
        ended_on:
          type: string
          format: date
          description: Inclusive current UTC date.
        total_request_count:
          type: integer
          minimum: 0
          description: Client requests made by the authenticated user in the window.
        active_day_count:
          type: integer
          minimum: 0
          maximum: 365
          description: UTC dates with at least one client request.
        current_streak_days:
          type: integer
          minimum: 0
          maximum: 365
          description: Consecutive active UTC dates ending on `ended_on`.
        longest_streak_days:
          type: integer
          minimum: 0
          maximum: 365
          description: Longest consecutive run of active UTC dates in the window.
        days:
          type: array
          minItems: 365
          maxItems: 365
          description: Continuous UTC dates in ascending order, including zero-request dates.
          items: { $ref: "#/components/schemas/PersonalUsageDay" }

    PersonalUsageDay:
      type: object
      required: [date, request_count]
      properties:
        date:
          type: string
          format: date
        request_count:
          type: integer
          minimum: 0

    ChannelStatusReport:
      type: object
      required: [window, started_at, ended_at, bucket_seconds, models, channels]
      properties:
        window: { $ref: "#/components/schemas/ChannelStatusWindow" }
        started_at: { $ref: "#/components/schemas/DateTime" }
        ended_at: { $ref: "#/components/schemas/DateTime" }
        bucket_seconds: { type: integer }
        models:
          type: array
          items: { $ref: "#/components/schemas/ChannelStatusModelMetric" }
        channels:
          type: array
          items: { $ref: "#/components/schemas/ChannelStatusChannel" }

    ChannelStatusModelMetric:
      type: object
      required:
        [api_format, model, request_count, success_rate, p90_ttft_ms, p50_tps]
      properties:
        api_format: { $ref: "#/components/schemas/ApiFormat" }
        model: { type: string }
        request_count: { type: integer }
        success_rate:
          type: number
          format: double
          minimum: 0
          maximum: 1
          nullable: true
          description: Successful requests divided by non-cancelled terminal requests.
        p90_ttft_ms:
          type: number
          format: double
          minimum: 0
          nullable: true
        p50_tps:
          type: number
          format: double
          minimum: 0
          nullable: true

    ChannelStatusChannel:
      type: object
      required:
        [id, channel_group_id, channel_group_name, api_format, name, enabled,
