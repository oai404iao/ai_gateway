  /statistics/channel-status:
    get:
      tags: [Statistics]
      operationId: getChannelStatusStatistics
      description: |
        Available to every authenticated Console user.
        Aggregates P90 TTFT, P50 output TPS, and terminal success rate for
        channels whose `status_statistics_enabled` flag is true. Model
        identifiers prefer the selected upstream model and retain the API
        format dimension. Client-cancelled requests do not participate in the
        success-rate denominator.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/StatisticsWindow"
      responses:
        "200":
          description: Channel and model status metrics.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChannelStatusReport" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /statistics/costs:
    get:
      tags: [Statistics]
      operationId: getCostStatistics
      description: |
        Regular users can only aggregate their own requests. Administrators
        can aggregate all users or filter by `user_id`, `api_key_id`, and
        `channel_id`. Channel-level details are returned only to administrators.
        Aggregates request counts, token totals and usage categories, RPM/TPM,
        and cost by UTC hour or day. All monetary amounts are settled in USD,
        and the response includes continuous zero-valued buckets across the
        selected range. Client-cancelled requests do not participate in model
        success rates.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/StatisticsStartedAfter"
        - $ref: "#/components/parameters/StatisticsStartedBefore"
        - $ref: "#/components/parameters/StatisticsGranularity"
        - $ref: "#/components/parameters/RequestLogUserId"
        - $ref: "#/components/parameters/RequestLogApiKeyId"
        - $ref: "#/components/parameters/StatisticsChannelId"
