        - $ref: "#/components/parameters/RequestLogApiFormat"
        - $ref: "#/components/parameters/RequestLogOutcome"
        - $ref: "#/components/parameters/RequestLogStartedAfter"
        - $ref: "#/components/parameters/RequestLogStartedBefore"
        - $ref: "#/components/parameters/RequestLogBilled"
      responses:
        "200":
