        request_count: { type: integer }
        priced_request_count: { type: integer }
        total_tokens: { type: integer }
        input_tokens:
          type: integer
          description: Total input tokens, including cached and cache-write input.
        cached_input_tokens:
          type: integer
          description: Input tokens served from an upstream prompt cache.
        cache_write_tokens:
          type: integer
          description: Input tokens reported as written to an upstream prompt cache.
        output_tokens: { type: integer }
        average_rpm: { type: number, format: double, minimum: 0 }
        average_tpm: { type: number, format: double, minimum: 0 }
        cost_amount:
          allOf: [{ $ref: "#/components/schemas/Decimal" }]
          description: Total cost in USD.

    CostStatisticsBucket:
      type: object
      required: [started_at, request_count, total_tokens, cost_amount, models]
      properties:
        started_at: { $ref: "#/components/schemas/DateTime" }
        request_count: { type: integer }
        total_tokens: { type: integer }
        cost_amount:
          allOf: [{ $ref: "#/components/schemas/Decimal" }]
          description: Bucket cost in USD.
        models:
          type: array
          items: { $ref: "#/components/schemas/CostStatisticsBucketModel" }

    CostStatisticsBucketModel:
      type: object
      required: [api_format, model, request_count, total_tokens, cost_amount]
      properties:
        api_format: { $ref: "#/components/schemas/ApiFormat" }
        model: { type: string }
        request_count: { type: integer }
        total_tokens: { type: integer }
        cost_amount:
          allOf: [{ $ref: "#/components/schemas/Decimal" }]
          description: Model cost in USD for this bucket.

    CostStatisticsModel:
      type: object
      required:
        [api_format, model, request_count, total_tokens, input_tokens,
         cached_input_tokens, cache_write_tokens, output_tokens, success_rate,
         cost_amount]
      properties:
        api_format: { $ref: "#/components/schemas/ApiFormat" }
        model: { type: string }
        request_count: { type: integer }
        total_tokens: { type: integer }
        input_tokens:
          type: integer
          description: Model input tokens, including cached and cache-write input.
        cached_input_tokens:
          type: integer
          description: Model input tokens served from an upstream prompt cache.
        cache_write_tokens:
          type: integer
          description: Model input tokens reported as written to an upstream prompt cache.
        output_tokens: { type: integer }
        success_rate:
          type: number
          format: double
          minimum: 0
          maximum: 1
          nullable: true
          description: Successful requests divided by non-cancelled terminal requests.
        cost_amount:
          allOf: [{ $ref: "#/components/schemas/Decimal" }]
          description: Total model cost in USD.

    CostStatisticsChannel:
      type: object
      required:
        [id, channel_group_id, channel_group_name, name, api_format, request_count,
         total_tokens, input_tokens, cached_input_tokens, cache_write_tokens,
         output_tokens, success_rate, cost_amount]
      properties:
        id: { type: string, format: uuid }
        channel_group_id: { type: string, format: uuid }
        channel_group_name: { type: string }
        name: { type: string }
        api_format: { $ref: "#/components/schemas/ApiFormat" }
        request_count: { type: integer }
        total_tokens: { type: integer }
        input_tokens:
          type: integer
          description: Channel input tokens, including cached and cache-write input.
        cached_input_tokens:
          type: integer
          description: Channel input tokens served from an upstream prompt cache.
        cache_write_tokens:
          type: integer
          description: Channel input tokens reported as written to an upstream prompt cache.
        output_tokens: { type: integer }
        success_rate:
          type: number
          format: double
          minimum: 0
          maximum: 1
          nullable: true
          description: Successful requests divided by non-cancelled terminal requests.
        cost_amount:
          allOf: [{ $ref: "#/components/schemas/Decimal" }]
          description: Total channel cost in USD.

    SpendLeaderboardPeriod:
      type: string
      enum: [day, week, month]

    SpendLeaderboardReport:
      type: object
      required:
        [period, period_start, period_end, refreshed_at, total_cost_amount,
         previous_period_start, next_period_start, entries]
      properties:
        period: { $ref: "#/components/schemas/SpendLeaderboardPeriod" }
        period_start:
          type: string
          format: date
          description: Inclusive Asia/Shanghai natural-period start.
        period_end:
          type: string
          format: date
          description: Exclusive Asia/Shanghai natural-period end.
        refreshed_at:
          allOf: [{ $ref: "#/components/schemas/DateTime" }]
          nullable: true
          description: Snapshot refresh timestamp, or null before the first refresh completes.
        total_cost_amount:
          allOf: [{ $ref: "#/components/schemas/Decimal" }]
          description: Total recorded cost for every qualifying user in USD, before the entry limit.
        previous_period_start:
          type: string
          format: date
          nullable: true
          description: Nearest earlier retained period of the same type.
        next_period_start:
          type: string
          format: date
          nullable: true
          description: Nearest later retained period of the same type.
        entries:
          type: array
          description: Descending user-cost ranking from the selected snapshot, capped by the requested limit.
          items: { $ref: "#/components/schemas/SpendLeaderboardEntry" }

    SpendLeaderboardEntry:
      type: object
      required:
        [rank, user_id, display_name, request_count, priced_request_count,
         total_tokens, cost_amount]
      properties:
        rank: { type: integer, minimum: 1 }
        user_id: { type: string, format: uuid }
        display_name: { type: string }
        request_count:
          type: integer
          description: All requests by this user in the selected period.
        priced_request_count:
          type: integer
          description: Requests by this user whose final cost is known.
        total_tokens:
          type: integer
          description: Input plus output tokens for all requests by this user in the selected period.
        cost_amount:
          allOf: [{ $ref: "#/components/schemas/Decimal" }]
          description: Total recorded user cost in USD.

    AuditLogView:
      type: object
      required:
        [id, occurred_at, actor_user_id, actor_type, actor_role, action,
         object_type, object_id, before_redacted, after_redacted,
         correlation_id, reason]
      properties:
        id: { type: string, format: uuid }
        occurred_at: { $ref: "#/components/schemas/DateTime" }
        actor_user_id: { type: string, format: uuid, nullable: true }
        actor_type: { type: string }
        actor_role: { type: string, nullable: true }
        action: { type: string }
        object_type: { type: string }
        object_id: { type: string, format: uuid }
        before_redacted: { $ref: "#/components/schemas/JsonValue" }
        after_redacted: { $ref: "#/components/schemas/JsonValue" }
        correlation_id: { type: string, nullable: true }
        reason: { type: string, nullable: true }

    ModelSyncPreview:
      type: object
      required:
        [fetched_at, models, excluded_missing_prices, excluded_invalid_models,
         excluded_oversized_metadata]
      properties:
        fetched_at: { $ref: "#/components/schemas/DateTime" }
        models:
          type: array
          items: { $ref: "#/components/schemas/ModelSyncPreviewModel" }
        excluded_missing_prices: { type: integer }
        excluded_invalid_models: { type: integer }
        excluded_oversized_metadata: { type: integer }

    ModelSyncPreviewModel:
      type: object
      required:
        [provider_id, provider_name, model_id, display_name, input_unit_price,
         cached_input_unit_price, cache_write_unit_price, output_unit_price,
         advanced_billing, action]
      properties:
        provider_id: { type: string }
        provider_name: { type: string }
        model_id: { type: string }
        display_name: { type: string }
        input_unit_price: { $ref: "#/components/schemas/Decimal" }
        cached_input_unit_price: { $ref: "#/components/schemas/Decimal" }
        cache_write_unit_price: { $ref: "#/components/schemas/Decimal" }
        output_unit_price: { $ref: "#/components/schemas/Decimal" }
        advanced_billing: { $ref: "#/components/schemas/AdvancedBilling" }
        action: { $ref: "#/components/schemas/ModelSyncAction" }

    ModelImportResponse:
      type: object
      required: [model_count, imported_count, updated_count, correlation_id]
      properties:
        model_count: { type: integer }
        imported_count: { type: integer }
        updated_count: { type: integer }
        correlation_id: { type: string, format: uuid }

    # ---- Request bodies ----
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }

    RegisterInput:
      type: object
      required: [invitation_code, email, display_name, password]
      properties:
        invitation_code:
          type: string
          minLength: 12
          maxLength: 128
          description: Case-sensitive reusable registration invitation code.
        email: { type: string, maxLength: 320 }
        display_name: { type: string, minLength: 1, maxLength: 200 }
        password: { type: string, minLength: 12, maxLength: 1024 }

    ActivateInvitationInput:
      type: object
      required: [invitation_token, password]
      properties:
        invitation_token: { type: string }
        password: { type: string }

    ProfileUpdateInput:
      type: object
      required: [display_name]
      properties:
        display_name: { type: string }

    UserSettingsInput:
      type: object
      required: [websocket_enabled]
      properties:
        websocket_enabled:
          type: boolean
          description: User opt-in for Responses WebSocket forwarding.

    PasswordChangeInput:
      type: object
      required: [current_password, new_password]
      properties:
        current_password: { type: string }
        new_password: { type: string }

    CompletePasswordResetInput:
      type: object
      required: [new_password]
      properties:
        new_password: { type: string, minLength: 12, maxLength: 1024 }

    TemporaryPasswordInput:
      type: object
      required: [current_password]
      properties:
        current_password:
          type: string
          minLength: 12
          maxLength: 1024
          description: Current password of the administrator issuing the temporary credential.

    RevokeInput:
      type: object
      required: [reason]
      properties:
        reason: { type: string }

    SelfApiKeyCreateInput:
      type: object
      required: [name, allowed_group_ids, allowed_channel_ids]
      properties:
        name: { type: string }
        allowed_group_ids:
          type: array
          items: { type: string, format: uuid }
        allowed_channel_ids:
          type: array
          items: { type: string, format: uuid }
        expires_at: { $ref: "#/components/schemas/DateTimeNullable" }
        requests_per_minute: { type: integer, nullable: true }
        max_concurrent_requests: { type: integer, nullable: true }
        quota_limit_amount: { $ref: "#/components/schemas/DecimalNullable" }

    SelfApiKeyUpdateInput:
      type: object
      required: [name, status, allowed_group_ids, allowed_channel_ids]
      properties:
        name: { type: string }
        status: { type: string }
        allowed_group_ids:
          type: array
          items: { type: string, format: uuid }
        allowed_channel_ids:
          type: array
          items: { type: string, format: uuid }
        expires_at: { $ref: "#/components/schemas/DateTimeNullable" }
        requests_per_minute: { type: integer, nullable: true }
        max_concurrent_requests: { type: integer, nullable: true }
        quota_limit_amount: { $ref: "#/components/schemas/DecimalNullable" }

    InviteUserInput:
      type: object
      required: [email, display_name, role]
      properties:
        email: { type: string }
        display_name: { type: string }
        role: { $ref: "#/components/schemas/UserRole" }
        initial_balance_amount:
          allOf: [{ $ref: "#/components/schemas/Decimal" }]
          description: Initial non-negative account balance in USD; defaults to zero.
        user_group_id:
          type: string
          format: uuid
          nullable: true
          description: |
            Explicit group assignment. Null or omission selects the protected
            default group for the requested role.
        default_api_key_policy_id: { type: string, format: uuid, nullable: true }

    RegistrationInvitationCodeCreateInput:
      type: object
      required:
        [name, invitation_code, max_uses, expires_at, enabled, user_group_id,
         initial_balance_amount]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        invitation_code:
          type: string
          minLength: 12
          maxLength: 128
          description: |
            Administrator-supplied, case-sensitive code with no whitespace.
            Only its SHA-256 hash is persisted.
        max_uses:
          type: integer
          format: int64
          minimum: 1
          nullable: true
          description: Null means unlimited registrations.
        expires_at:
          allOf: [{ $ref: "#/components/schemas/DateTimeNullable" }]
          description: Null means no time-based expiry.
        enabled: { type: boolean }
        user_group_id: { type: string, format: uuid }
        initial_balance_amount:
          allOf: [{ $ref: "#/components/schemas/Decimal" }]
          description: Initial non-negative USD balance for future registrations.

    RegistrationInvitationCodeUpdateInput:
      type: object
      required:
        [name, max_uses, expires_at, enabled, user_group_id,
         initial_balance_amount]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        max_uses:
          type: integer
          format: int64
          minimum: 1
          nullable: true
          description: Null means unlimited; cannot be below `used_count`.
        expires_at:
          allOf: [{ $ref: "#/components/schemas/DateTimeNullable" }]
          description: Null removes time-based expiry.
        enabled: { type: boolean }
        user_group_id: { type: string, format: uuid }
        initial_balance_amount:
          allOf: [{ $ref: "#/components/schemas/Decimal" }]
          description: Updated initial USD balance for future registrations.

    UserInput:
      type: object
      required: [display_name, role, status, balance_amount]
      properties:
        display_name: { type: string }
        email: { type: string, nullable: true }
        role: { $ref: "#/components/schemas/UserRole" }
        status: { type: string }
        balance_amount:
          allOf: [{ $ref: "#/components/schemas/Decimal" }]
          description: Current account balance in USD.
        user_group_id:
          type: string
          format: uuid
          nullable: true
          description: Null or omission selects the protected default role group.
        default_api_key_policy_id: { type: string, format: uuid, nullable: true }

    UserUpdateInput:
      type: object
      minProperties: 1
      properties:
        display_name: { type: string }
        email:
          type: string
          nullable: true
          description: Set to null to clear the email; omit to preserve it.
        role: { $ref: "#/components/schemas/UserRole" }
        status:
          type: string
          enum: [active, suspended, disabled]
          description: |
            Runtime access state. Pending invitations are activated only
            through `/auth/activate-invitation`.
        balance_amount:
          allOf: [{ $ref: "#/components/schemas/Decimal" }]
          description: Replaces the current account balance in USD.
        user_group_id:
          type: string
          format: uuid
          description: Moves the user to this group; omit to preserve membership.
        default_api_key_policy_id:
          type: string
          format: uuid
          nullable: true
          description: |
            Set to null to inherit the group policy; omit to preserve the
            current user-level override.

    UserBatchUpdateTarget:
      type: object
      required: [id, updated_at]
      properties:
        id: { type: string, format: uuid }
        updated_at:
          allOf: [{ $ref: "#/components/schemas/DateTime" }]
          description: Version copied from the user list response.

    UserBalanceBatchChange:
      type: object
      required: [operation, amount]
      properties:
        operation:
          type: string
          enum: [set, increase, decrease]
        amount:
          allOf: [{ $ref: "#/components/schemas/Decimal" }]
          description: Non-negative USD amount.

    UserBatchChanges:
      type: object
      description: At least one property must be supplied.
      properties:
        status:
          type: string
          enum: [active, suspended, disabled]
        balance: { $ref: "#/components/schemas/UserBalanceBatchChange" }
        user_group_id: { type: string, format: uuid }
        default_api_key_policy_id:
          type: string
          format: uuid
          nullable: true
          description: Set to null to inherit each selected user's group policy.

    UserBatchUpdateInput:
      type: object
      required: [items, changes]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: "#/components/schemas/UserBatchUpdateTarget" }
        changes: { $ref: "#/components/schemas/UserBatchChanges" }

    UserGroupInput:
      type: object
      required:
        [name, default_api_key_policy_id, visible_codex_quota_group_ids]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 500, nullable: true }
        default_api_key_policy_id:
          type: string
          format: uuid
          nullable: true
        visible_codex_quota_group_ids:
          type: array
          description: |
            Canonical `codex_oauth` Responses channel groups whose shared
            credential quota windows may be read by group members.
          items: { type: string, format: uuid }

    ApiKeyPolicyInput:
      type: object
      required: [name, allowed_group_ids, allowed_channel_ids, enabled]
      properties:
        name: { type: string }
        allowed_group_ids:
          type: array
          items: { type: string, format: uuid }
        allowed_channel_ids:
          type: array
          items: { type: string, format: uuid }
        enabled: { type: boolean }

    ApiKeyCreateInput:
      type: object
      required:
        [user_id, name, allowed_api_formats, permissions, allowed_group_ids,
         allowed_channel_ids]
      properties:
        user_id: { type: string, format: uuid }
        name: { type: string }
        allowed_api_formats:
          type: array
          items: { $ref: "#/components/schemas/ApiFormat" }
        permissions:
          type: array
          items: { type: string }
        allowed_group_ids:
          type: array
          items: { type: string, format: uuid }
        allowed_channel_ids:
          type: array
          items: { type: string, format: uuid }
        expires_at: { $ref: "#/components/schemas/DateTimeNullable" }
        requests_per_minute: { type: integer, nullable: true }
        max_concurrent_requests: { type: integer, nullable: true }
        quota_limit_amount: { $ref: "#/components/schemas/DecimalNullable" }

    ApiKeyUpdateInput:
      type: object
      required:
        [name, status, allowed_api_formats, permissions, allowed_group_ids,
         allowed_channel_ids]
      properties:
        name: { type: string }
        status: { type: string }
        allowed_api_formats:
          type: array
          items: { $ref: "#/components/schemas/ApiFormat" }
        permissions:
          type: array
          items: { type: string }
        allowed_group_ids:
          type: array
          items: { type: string, format: uuid }
        allowed_channel_ids:
          type: array
          items: { type: string, format: uuid }
        expires_at: { $ref: "#/components/schemas/DateTimeNullable" }
        requests_per_minute: { type: integer, nullable: true }
        max_concurrent_requests: { type: integer, nullable: true }
        quota_limit_amount: { $ref: "#/components/schemas/DecimalNullable" }

    ModelInput:
      type: object
      required:
        [source_model_id, display_name, enabled, price_unit_tokens,
         input_unit_price, cached_input_unit_price, cache_write_unit_price,
         output_unit_price, price_effective_at]
      properties:
        source_model_id: { type: string }
        display_name: { type: string }
        provider_name: { type: string, nullable: true }
        enabled: { type: boolean }
        price_unit_tokens: { type: integer }
        input_unit_price: { $ref: "#/components/schemas/Decimal" }
        cached_input_unit_price: { $ref: "#/components/schemas/Decimal" }
        cache_write_unit_price: { $ref: "#/components/schemas/Decimal" }
        output_unit_price: { $ref: "#/components/schemas/Decimal" }
        price_effective_at: { $ref: "#/components/schemas/DateTime" }
        advanced_billing:
          allOf: [{ $ref: "#/components/schemas/AdvancedBilling" }]
          description: Omit on update to preserve the stored model-level advanced billing policy.
        source_payload: { $ref: "#/components/schemas/JsonValue" }

    AdvancedBilling:
      type: object
      required: [long_context_tiers, request_multipliers]
      description: Model-level pricing rules. Long-context tiers replace base input/cache prices and optionally the output price at or above their threshold; all matching request multipliers are multiplied together and apply to the whole request cost.
      properties:
        long_context_tiers:
          type: array
          description: Strictly ascending input-token thresholds. A threshold selects the complete request's tier prices, including an optional output price.
          items: { $ref: "#/components/schemas/LongContextTier" }
        request_multipliers:
          type: array
          description: Exact JSON Pointer matches evaluated against the original client request body before request transforms.
          items: { $ref: "#/components/schemas/RequestBillingMultiplier" }

    LongContextTier:
      type: object
      required:
        [input_tokens_threshold, input_unit_price, cached_input_unit_price,
         cache_write_unit_price]
      properties:
        input_tokens_threshold:
          type: integer
          minimum: 1
          description: Applies when reported input tokens are greater than or equal to this value.
        input_unit_price: { $ref: "#/components/schemas/Decimal" }
        cached_input_unit_price: { $ref: "#/components/schemas/Decimal" }
        cache_write_unit_price: { $ref: "#/components/schemas/Decimal" }
        output_unit_price:
          allOf: [{ $ref: "#/components/schemas/Decimal" }]
          description: Optional for compatibility; when omitted, the base output price remains active for this tier.

    RequestBillingMultiplier:
      type: object
      required: [json_pointer, value, multiplier]
      properties:
        json_pointer:
          type: string
          maxLength: 512
          description: RFC 6901 JSON Pointer into the original client request body.
        value:
          allOf: [{ $ref: "#/components/schemas/JsonValue" }]
          description: Exact JSON value that activates this multiplier.
        multiplier:
          allOf: [{ $ref: "#/components/schemas/Decimal" }]
          description: Non-negative multiplier applied with every other matched request multiplier and the selected channel multiplier.

    ChannelGroupInput:
      type: object
      required: [name, api_format, connector_kind, priority, selection_strategy, enabled]
      properties:
        name: { type: string }
        api_format:
          allOf: [{ $ref: "#/components/schemas/ApiFormat" }]
          description: >
            New codex_oauth pools start with open_ai_responses; the server also
            creates a disabled open_ai_images group in the same credential pool.
        connector_kind: { $ref: "#/components/schemas/ConnectorKind" }
        priority: { type: integer, minimum: 0 }
        selection_strategy: { $ref: "#/components/schemas/SelectionStrategy" }
        enabled: { type: boolean }

    ChannelCreateInput:
      type: object
      required:
        [channel_group_id, api_format, name, base_url, enabled, weight, upstream_auth_kind]
      properties:
        channel_group_id: { type: string, format: uuid }
        api_format: { $ref: "#/components/schemas/ApiFormat" }
        name: { type: string }
        base_url:
          type: string
          format: uri
          description: HTTP(S) URL without embedded credentials, query, or fragment.
        enabled: { type: boolean }
        supports_websocket:
          type: boolean
          default: false
          description: Valid only for open_ai_responses channels.
        status_statistics_enabled:
          type: boolean
          default: false
          description: Includes this channel in the administrator channel-status report.
        auto_disable_allowed:
          type: boolean
          default: false
          description: Allows configured automatic-disable rules to temporarily remove this channel from routing.
        weight: { type: integer, minimum: 1 }
        billing_multiplier:
          allOf: [{ $ref: "#/components/schemas/Decimal" }]
          default: "1"
          description: Non-negative multiplier applied to upstream model prices for settlement.
        proxy_id: { type: string, format: uuid, nullable: true }
        config_template_id: { type: string, format: uuid, nullable: true }
        override_document: { $ref: "#/components/schemas/JsonValue" }
        connect_timeout_ms: { type: integer, minimum: 1, nullable: true }
        response_header_timeout_ms: { type: integer, minimum: 1, nullable: true }
        stream_idle_timeout_ms: { type: integer, minimum: 1, nullable: true }
        upstream_auth_kind: { $ref: "#/components/schemas/UpstreamAuthKind" }
        upstream_auth_header_name: { type: string, nullable: true }
        upstream_api_key: { type: string, nullable: true }
        available_models:
          type: array
          items: { type: string }
        test_model:
          type: string
          nullable: true
          description: Must be one of available_models when set.

    ChannelInput:
      type: object
      required:
        [channel_group_id, api_format, name, base_url, enabled, weight, upstream_auth_kind]
      properties:
        channel_group_id: { type: string, format: uuid }
        api_format: { $ref: "#/components/schemas/ApiFormat" }
        name: { type: string }
        base_url:
          type: string
          format: uri
          description: HTTP(S) URL without embedded credentials, query, or fragment.
        enabled: { type: boolean }
        supports_websocket:
          type: boolean
          default: false
          description: Valid only for open_ai_responses channels.
        status_statistics_enabled:
          type: boolean
          default: false
          description: Includes this channel in the administrator channel-status report.
        auto_disable_allowed:
          type: boolean
          default: false
          description: Allows configured automatic-disable rules to temporarily remove this channel from routing.
        weight: { type: integer, minimum: 1 }
        billing_multiplier:
          allOf: [{ $ref: "#/components/schemas/Decimal" }]
          description: Omit to preserve the stored non-negative billing multiplier.
        proxy_id: { type: string, format: uuid, nullable: true }
        config_template_id: { type: string, format: uuid, nullable: true }
        override_document:
          allOf: [{ $ref: "#/components/schemas/JsonValue" }]
          description: Omit to preserve the stored document; send `{}` to clear it.
        connect_timeout_ms: { type: integer, minimum: 1, nullable: true }
        response_header_timeout_ms: { type: integer, minimum: 1, nullable: true }
        stream_idle_timeout_ms: { type: integer, minimum: 1, nullable: true }
        upstream_auth_kind: { $ref: "#/components/schemas/UpstreamAuthKind" }
        upstream_auth_header_name: { type: string, nullable: true }
        upstream_api_key: { type: string, nullable: true }
        available_models:
          type: array
          items: { type: string }
        test_model:
          type: string
          nullable: true
          description: Must be one of available_models when set.

    ChannelModelDiscoveryInput:
      type: object
      required: [api_format, base_url, upstream_auth_kind]
      properties:
        api_format: { $ref: "#/components/schemas/ApiFormat" }
        base_url:
          type: string
          format: uri
          description: HTTP(S) URL without embedded credentials, query, or fragment.
        proxy_id: { type: string, format: uuid, nullable: true }
        config_template_id: { type: string, format: uuid, nullable: true }
        override_document:
          allOf: [{ $ref: "#/components/schemas/JsonValue" }]
          default: {}
        connect_timeout_ms: { type: integer, minimum: 1, nullable: true }
        response_header_timeout_ms: { type: integer, minimum: 1, nullable: true }
        stream_idle_timeout_ms: { type: integer, minimum: 1, nullable: true }
        upstream_auth_kind: { $ref: "#/components/schemas/UpstreamAuthKind" }
        upstream_auth_header_name: { type: string, nullable: true }
        upstream_api_key: { type: string, nullable: true }

    ChannelModelDiscoveryResponse:
      type: object
      required: [models]
      properties:
        models:
          type: array
          items: { type: string }

    ChannelBatchUpdateTarget:
      type: object
      required: [id, updated_at]
      properties:
        id: { type: string, format: uuid }
        updated_at:
          allOf: [{ $ref: "#/components/schemas/DateTime" }]
          description: Version copied from the channel list response.

    ChannelBatchChanges:
      type: object
      description: At least one property must be supplied.
      properties:
        enabled: { type: boolean }
        status_statistics_enabled: { type: boolean }
        auto_disable_allowed: { type: boolean }
        weight: { type: integer, minimum: 1 }
        billing_multiplier:
          allOf: [{ $ref: "#/components/schemas/Decimal" }]
          description: Non-negative multiplier applied to upstream model prices for settlement.

    ChannelBatchUpdateInput:
      type: object
      required: [items, changes]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: "#/components/schemas/ChannelBatchUpdateTarget" }
        changes: { $ref: "#/components/schemas/ChannelBatchChanges" }

    ChannelBatchUpdateResponse:
      type: object
      required: [updated_ids, correlation_id]
      properties:
        updated_ids:
          type: array
          items: { type: string, format: uuid }
        correlation_id: { type: string, format: uuid }

    ChannelRecoverInput:
      type: object
      required: [updated_at]
      properties:
        updated_at:
          allOf: [{ $ref: "#/components/schemas/DateTime" }]
          description: Version copied from the channel list response.

    ModelRuleInput:
      type: object
      required: [client_model, api_format, upstream_model_id, enabled]
      properties:
        client_model: { type: string }
        api_format: { $ref: "#/components/schemas/ApiFormat" }
        upstream_model_id: { type: string, format: uuid }
        description: { type: string, nullable: true }
        channel_group_ids:
          type: array
          items: { type: string, format: uuid }
        channel_ids:
          type: array
          items: { type: string, format: uuid }
        enabled: { type: boolean }

    ProxyCreateInput:
      type: object
      required: [name, proxy_url, enabled]
      properties:
        name: { type: string }
        proxy_url: { type: string }
        username: { type: string, nullable: true }
        password: { type: string, nullable: true }
        no_proxy_hosts:
          type: array
          items: { type: string }
        enabled: { type: boolean }

    ProxyInput:
      type: object
      required: [name, proxy_url, enabled]
      properties:
        name: { type: string }
        proxy_url: { type: string }
        username: { type: string, nullable: true }
        password: { type: string, nullable: true }
        no_proxy_hosts:
          type: array
          items: { type: string }
        enabled: { type: boolean }

    ProxyTestInput:
      type: object
      required: [proxy_url]
      properties:
        proxy_id:
          type: string
          format: uuid
          nullable: true
          description: Existing proxy whose hidden credentials may be reused.
        proxy_url: { type: string }
        username:
          type: string
          nullable: true
          description: >
            Omit to reuse the saved username when `proxy_id` points at the same
            endpoint; send null to test without a username.
        password:
          type: string
          nullable: true
          description: >
            Omit to reuse the saved password when `proxy_id` points at the same
            endpoint; send null to test without a password.

    ConfigTemplateCreateInput:
      type: object
      required: [name, document, enabled]
      properties:
        name: { type: string }
        description: { type: string, nullable: true }
        document: { $ref: "#/components/schemas/JsonValue" }
        enabled: { type: boolean }

    ConfigTemplateInput:
      type: object
      required: [name, enabled]
      properties:
        name: { type: string }
        description: { type: string, nullable: true }
        document:
          allOf: [{ $ref: "#/components/schemas/JsonValue" }]
          description: Omit to preserve the stored document; send `{}` to clear it.
        enabled: { type: boolean }

    ModelSyncPreviewRequest:
      type: object
      properties:
        provider_ids:
          type: array
          items: { type: string }

    ModelImportRequest:
      type: object
      required: [selections]
      properties:
        selections:
          type: array
          items: { $ref: "#/components/schemas/ModelSyncSelection" }

    ModelSyncSelection:
      type: object
      required: [provider_id, model_id]
      properties:
        provider_id: { type: string }
        model_id: { type: string }

    ListQuery:
      type: object
      properties:
        limit: { type: integer, minimum: 1, maximum: 100 }
        user_id: { type: string, format: uuid }
        api_key_id: { type: string, format: uuid }
        model: { type: string, maxLength: 300 }
        api_format: { $ref: "#/components/schemas/ApiFormat" }
        outcome:
          type: string
          enum: [succeeded, failed, rejected, cancelled]
        started_after: { $ref: "#/components/schemas/DateTime" }
        started_before: { $ref: "#/components/schemas/DateTime" }
        billed: { type: boolean }
