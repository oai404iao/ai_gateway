        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /statistics/costs:
    get:
      tags: [Self, Statistics]
      operationId: getOwnCostStatistics
      description: |
        Aggregates only the authenticated user's requests for every caller,
        including administrators. The interface accepts the same filters and
        returns the same owner-visible fields regardless of role; `channels`
        is always empty. Use the administrator-only system endpoint for
        cross-user or channel-level analytics.
        Aggregates request counts, token totals and usage categories, RPM/TPM,
        and cost by UTC hour or day. All monetary amounts are settled in USD,
        and the response includes continuous zero-valued buckets across the
        selected range. Client-cancelled requests do not participate in model
        success rates.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/StatisticsStartedAfter"
        - $ref: "#/components/parameters/StatisticsStartedBefore"
        - $ref: "#/components/parameters/StatisticsGranularity"
        - $ref: "#/components/parameters/RequestLogApiKeyId"
      responses:
        "200":
          description: Owner-scoped cost and usage statistics.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CostStatisticsReport" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /statistics/spend-leaderboard:
    get:
      tags: [Statistics]
      operationId: getSpendLeaderboard
      description: |
        Available to every authenticated Console user. Reads a periodically
        refreshed snapshot instead of aggregating request logs at request time.
        Rankings use Asia/Shanghai boundaries: a day is 00:00 inclusive through
        the following 00:00 exclusive; a week is Monday through Sunday; and a
        month is the 1st through its final day. Only client requests participate.
        Omit `period_start` for the current period, or use the adjacent period
        values in the response to browse retained history. Users without any priced
        request in the selected period are omitted.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/SpendLeaderboardPeriod"
        - $ref: "#/components/parameters/SpendLeaderboardPeriodStart"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: User spend leaderboard.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SpendLeaderboardReport" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /system/statistics/costs:
    get:
      tags: [System, Statistics]
      operationId: getSystemCostStatistics
      description: |
        Administrator-only system-wide cost analytics. Administrators can
        aggregate all users or filter by `user_id`, `api_key_id`, and
        `channel_id`, or by one Codex credential across both of its managed
        Responses and Images channels; channel-level details are included in
        the response. `channel_id` and `codex_credential_id` are mutually
        exclusive.
        Aggregates request counts, token totals and usage categories, RPM/TPM,
        and cost by UTC hour or day. All monetary amounts are settled in USD,
        and the response includes continuous zero-valued buckets across the
        selected range. Client-cancelled requests do not participate in model
        or channel success rates.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/StatisticsStartedAfter"
        - $ref: "#/components/parameters/StatisticsStartedBefore"
        - $ref: "#/components/parameters/StatisticsGranularity"
        - $ref: "#/components/parameters/RequestLogUserId"
        - $ref: "#/components/parameters/RequestLogApiKeyId"
        - $ref: "#/components/parameters/StatisticsChannelId"
        - $ref: "#/components/parameters/StatisticsCodexCredentialId"
      responses:
        "200":
          description: System-wide cost and usage statistics.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CostStatisticsReport" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /audit-logs:
    get:
      tags: [AuditLogs]
      operationId: listAuditLogs
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Audit events.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AuditLogView" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /system/load:
    get:
      tags: [System]
      operationId: getSystemLoad
      description: |
        Administrator-only.
        Returns a current-instance operational snapshot for the gateway
        process and its host. Linux resource values are sampled from procfs;
        unsupported values and temporarily unavailable backlog queries are
        null. CPU percentages are deltas between samples, so the first sample
        after process start may be null. Queue depth, durable request-log
        backlog, runtime in-flight state, Responses WebSocket sessions and
        pool counters, Images edit temporary-body spool capacity/counters, and
        database pool pressure are process-local except for PostgreSQL-backed
        backlog counts.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Current system load and pressure snapshot.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemLoadReport" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /system/session-affinity/cache:
    get:
      tags: [System]
      operationId: getSessionAffinityCache
      description: |
        Administrator-only. Returns current-process, unexpired session-affinity
        entry counts for each compiled enabled rule.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Current session-affinity cache state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionAffinityCacheReport" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      tags: [System]
      operationId: clearSessionAffinityCache
      description: |
        Administrator-only. Clears all current-process entries, or only entries
        belonging to the named compiled rule.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/SessionAffinityRuleName"
      responses:
        "200":
          description: Cache entries cleared.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionAffinityCacheClearResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /system/settings:
    get:
      tags: [System]
      operationId: getSystemSettings
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Database-backed forwarding, retry, health, automation, scheduled-test, session-affinity, and Responses WebSocket defaults.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [System]
      operationId: updateSystemSettings
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SystemSettingsInput" }
      responses:
        "200":
          description: Saved and published to future requests.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MutationResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /system/reload:
    post:
      tags: [System]
      operationId: reload
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Reload accepted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReloadResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    PathId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: { type: string }
      description: ETag from the preceding GET; stale values yield `409`.
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    RequestLogUserId:
      name: user_id
      in: query
      required: false
      description: Administrator-only owner filter.
      schema: { type: string, format: uuid }
    RequestLogApiKeyId:
      name: api_key_id
      in: query
      required: false
      schema: { type: string, format: uuid }
    RequestLogModel:
      name: model
      in: query
      required: false
      description: Exact client-model or upstream-model identifier.
      schema: { type: string, maxLength: 300 }
    RequestLogApiFormat:
      name: api_format
      in: query
      required: false
      schema: { $ref: "#/components/schemas/ApiFormat" }
    RequestLogOutcome:
      name: outcome
      in: query
      required: false
      schema:
        type: string
        enum: [succeeded, failed, rejected, cancelled]
    RequestLogStartedAfter:
      name: started_after
      in: query
      required: false
      schema: { $ref: "#/components/schemas/DateTime" }
    RequestLogStartedBefore:
      name: started_before
      in: query
      required: false
      schema: { $ref: "#/components/schemas/DateTime" }
    RequestLogBilled:
      name: billed
      in: query
      required: false
      schema: { type: boolean }
    StatisticsWindow:
      name: window
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/ChannelStatusWindow"
        default: 24h
    StatisticsStartedAfter:
      name: started_after
      in: query
      required: false
      description: Inclusive range start; defaults to seven days before the end.
      schema: { $ref: "#/components/schemas/DateTime" }
    SpendLeaderboardPeriod:
      name: period
      in: query
      required: false
      description: "Natural Asia/Shanghai period to rank: day (00:00–next 00:00), week (Monday–Sunday), or month (day 1–final day)."
      schema:
        allOf: [{ $ref: "#/components/schemas/SpendLeaderboardPeriod" }]
        default: day
    SpendLeaderboardPeriodStart:
      name: period_start
      in: query
      required: false
      description: |
        Asia/Shanghai period start in YYYY-MM-DD form. Weeks must start Monday;
        months must start on day 1. Omit for the current natural period.
      schema: { type: string, format: date }
    StatisticsStartedBefore:
      name: started_before
      in: query
      required: false
      description: Exclusive range end; defaults to the current time.
      schema: { $ref: "#/components/schemas/DateTime" }
    StatisticsGranularity:
      name: granularity
      in: query
      required: false
      description: Hour supports at most 31 days; day supports at most 366 days.
      schema:
        $ref: "#/components/schemas/StatisticsGranularity"
        default: day
    StatisticsChannelId:
      name: channel_id
      in: query
      required: false
      description: Administrator-only exact channel filter.
      schema: { type: string, format: uuid }
    StatisticsCodexCredentialId:
      name: codex_credential_id
      in: query
      required: false
      description: >
        Administrator-only Codex credential filter that includes both managed
        Responses and Images projection channels. Mutually exclusive with
        `channel_id`.
      schema: { type: string, format: uuid }
    CodexQuotaHistoryLimit:
      name: limit
      in: query
      required: false
      description: Maximum periods returned independently for each window.
      schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
    SessionAffinityRuleName:
      name: rule_name
      in: query
      required: false
      description: Exact session-affinity rule name. Omit to clear the whole cache.
      schema: { type: string, minLength: 1, maxLength: 64 }

  headers:
    ETag:
      description: Optimistic-concurrency version tag for `PUT` `If-Match`.
      schema: { type: string }

  responses:
    Unauthorized:
      description: Unauthorized.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    Forbidden:
      description: Forbidden.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    NotFound:
      description: Not found.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    Conflict:
      description: Optimistic-concurrency conflict or serializable retry.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    Unprocessable:
      description: Request rejected (validation).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    RateLimited:
      description: Too many authentication attempts.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    BadGateway:
      description: Upstream catalog operation rejected.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    GatewayTimeout:
      description: Upstream operation timed out.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }

  schemas:
    ErrorBody:
      type: object
      required: [error]
      properties:
        error: { type: string }

    UserRole:
      type: string
      enum: [user, admin]
    ApiFormat:
      type: string
      enum: [open_ai_chat_completions, open_ai_responses, open_ai_images]
    ApiOperation:
      type: string
      enum: [chat_completions, responses, images_generation, images_edit]
    SelectionStrategy:
      type: string
      enum: [weighted_random, weighted_round_robin]
    ConnectorKind:
      type: string
      enum: [openai_compatible, codex_oauth]
    UpstreamAuthKind:
      type: string
      enum: [none, bearer, header]
    ModelSyncAction:
      type: string
      enum: [price_update, import]
    ChannelStatusWindow:
      type: string
      enum: [24h, 3d, 7d]
    StatisticsGranularity:
      type: string
      enum: [hour, day]

    DateTime:
      type: string
      format: date-time
    Decimal:
      type: string
      description: rust_decimal::Decimal serialized as a string.
    DateTimeNullable:
      type: string
      format: date-time
      nullable: true
    DecimalNullable:
      type: string
      nullable: true
      description: rust_decimal::Decimal serialized as a string, or null.
    JsonValue:
      description: Arbitrary JSON; typed as `unknown`.
      # Empty schema => openapi-typescript emits `unknown`.

    ConsoleUser:
      type: object
      required:
        [id, email, display_name, role, password_change_required,
         temporary_password_expires_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        display_name: { type: string }
        role: { $ref: "#/components/schemas/UserRole" }
        password_change_required:
          type: boolean
          description: True only for a password-change-only temporary-password session.
        temporary_password_expires_at:
          allOf: [{ $ref: "#/components/schemas/DateTimeNullable" }]
          description: Expiry of the current temporary password, or null for a normal session.

    LoginResponse:
      type: object
      required: [access_token, token_type, expires_in, user]
      properties:
        access_token: { type: string }
        token_type: { type: string, enum: [Bearer] }
        expires_in: { type: integer }
        user: { $ref: "#/components/schemas/ConsoleUser" }

    ConsoleProfile:
      type: object
      required:
        [id, email, display_name, role, status, balance_amount, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, nullable: true }
        display_name: { type: string }
        role: { $ref: "#/components/schemas/UserRole" }
        status: { type: string }
        balance_amount:
          allOf: [{ $ref: "#/components/schemas/Decimal" }]
          description: Current account balance in USD.
        created_at: { $ref: "#/components/schemas/DateTime" }
        updated_at: { $ref: "#/components/schemas/DateTime" }

    UserSettings:
      type: object
      required: [websocket_enabled, updated_at]
      properties:
        websocket_enabled:
          type: boolean
          description: User opt-in required before this user's API keys can open Responses WebSockets.
        updated_at: { $ref: "#/components/schemas/DateTime" }

    ConsoleSessionState:
      type: string
      enum: [active, expired, revoked]

    ConsoleSession:
      type: object
      required:
        [id, user_agent, created_at, last_seen_at, expires_at, revoked_at, state,
         is_current]
      properties:
        id: { type: string, format: uuid }
        user_agent:
          type: string
          maxLength: 512
          nullable: true
          description: Browser-supplied User-Agent captured when the session was issued or refreshed.
        created_at: { $ref: "#/components/schemas/DateTime" }
        last_seen_at:
          allOf: [{ $ref: "#/components/schemas/DateTime" }]
          description: Last refresh-token rotation time; initially equal to created_at.
        expires_at: { $ref: "#/components/schemas/DateTime" }
        revoked_at: { $ref: "#/components/schemas/DateTimeNullable" }
        state: { $ref: "#/components/schemas/ConsoleSessionState" }
        is_current:
          type: boolean
          description: Whether this session authenticated the list request.

    InvitationResponse:
      type: object
      required: [id, user_id, invitation_token, expires_at, correlation_id]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        invitation_token: { type: string }
        expires_at: { $ref: "#/components/schemas/DateTime" }
        correlation_id: { type: string, format: uuid }

    TemporaryPasswordResponse:
      type: object
      required: [user_id, temporary_password, expires_at, correlation_id]
      properties:
        user_id: { type: string, format: uuid }
        temporary_password:
          type: string
          description: One-time plaintext value; it cannot be retrieved later.
        expires_at: { $ref: "#/components/schemas/DateTime" }
        correlation_id: { type: string, format: uuid }

    RegistrationInvitationCodeView:
      type: object
      required:
        [id, name, max_uses, used_count, expires_at, enabled, user_group_id,
         initial_balance_amount, created_by, last_used_at, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name:
          type: string
          description: Administrator-facing label; this is not the invitation code.
        max_uses:
          type: integer
          format: int64
          minimum: 1
          nullable: true
          description: Null means unlimited registrations.
        used_count:
          type: integer
          format: int64
          minimum: 0
        expires_at:
          allOf: [{ $ref: "#/components/schemas/DateTimeNullable" }]
          description: Null means no time-based expiry.
        enabled:
          type: boolean
          description: Disabled codes cannot register new users.
        user_group_id:
          type: string
          format: uuid
          description: Group assigned to future registrations.
        initial_balance_amount:
          allOf: [{ $ref: "#/components/schemas/Decimal" }]
          description: Non-negative USD balance assigned to future registrations.
        created_by: { type: string, format: uuid }
        last_used_at: { $ref: "#/components/schemas/DateTimeNullable" }
        created_at: { $ref: "#/components/schemas/DateTime" }
        updated_at: { $ref: "#/components/schemas/DateTime" }

    RegistrationInvitationCodeCreateResponse:
      type: object
      required: [id, invitation_code, correlation_id]
      properties:
        id: { type: string, format: uuid }
        invitation_code:
          type: string
          description: One-time plaintext value; it cannot be retrieved later.
        correlation_id: { type: string, format: uuid }

    MutationResponse:
      type: object
      required: [id, correlation_id]
      properties:
        id: { type: string, format: uuid }
        secret:
          type: string
          description: Created API key value; present only on API key create responses.
        correlation_id: { type: string, format: uuid }

    UserBatchUpdateResponse:
      type: object
      required: [updated_ids, correlation_id]
      properties:
        updated_ids:
          type: array
          items: { type: string, format: uuid }
        correlation_id: { type: string, format: uuid }

    ReloadResponse:
      type: object
      required: [correlation_id]
      properties:
        correlation_id: { type: string, format: uuid }

    SystemUpstreamSettings:
      type: object
      required:
        [connect_timeout_seconds, response_header_timeout_seconds, stream_idle_timeout_seconds]
      properties:
        connect_timeout_seconds: { type: integer, format: int64, minimum: 1 }
        response_header_timeout_seconds: { type: integer, format: int64, minimum: 1 }
        stream_idle_timeout_seconds: { type: integer, format: int64, minimum: 1 }

    SystemRequestRetrySettings:
      type: object
      required: [enabled, max_retries]
      properties:
        enabled:
          type: boolean
          default: true
          description: Enables failover for connection failures, connect timeouts, and response-header timeouts.
        max_retries:
          type: integer
          minimum: 1
          maximum: 10
          default: 1
          description: Automatic retries after the initial distinct-channel attempt.

    SystemPassiveHealthSettings:
      type: object
      required: [connection_failure_threshold, cooldown_seconds]
      properties:
        connection_failure_threshold: { type: integer, minimum: 1 }
        cooldown_seconds: { type: integer, format: int64, minimum: 1 }

    SystemAutomaticDisableSettings:
      type: object
      required: [enabled, error_status_codes, error_message_keywords]
      properties:
        enabled:
          type: boolean
          description: Enables automatic temporary channel disablement for matching upstream errors.
        error_status_codes:
          type: array
          items: { type: integer, minimum: 100, maximum: 599 }
          description: Upstream HTTP statuses that trigger temporary disablement.
        error_message_keywords:
          type: array
          items: { type: string, minLength: 1, maxLength: 200 }
          description: Case-insensitive upstream error-message substrings that trigger temporary disablement.

    ScheduledTestingMode:
      type: string
      enum: [global, failure_only]

    SystemScheduledTestingSettings:
      type: object
      required: [mode, auto_recover, interval_minutes, prompt]
      properties:
        mode:
          allOf: [{ $ref: "#/components/schemas/ScheduledTestingMode" }]
          description: Global tests all enabled channels; failure_only tests only temporarily disabled channels.
        auto_recover:
          type: boolean
          description: Clears a temporary automatic disable after a successful scheduled test.
        interval_minutes: { type: integer, format: int64, minimum: 1, default: 5 }
        prompt:
          type: string
          minLength: 1
          maxLength: 4000
          default: "reply '1'"

    SystemSessionAffinityKeySource:
      oneOf:
        - $ref: "#/components/schemas/SystemSessionAffinityHeaderSource"
        - $ref: "#/components/schemas/SystemSessionAffinityJsonPointerSource"

    SystemSessionAffinityHeaderSource:
      type: object
      required: [type, name]
      properties:
        type: { type: string, enum: [request_header] }
        name:
          type: string
          minLength: 1
          maxLength: 256
          description: Non-sensitive request header used as an ordered affinity-key source.

    SystemSessionAffinityJsonPointerSource:
      type: object
      required: [type, pointer]
      properties:
        type: { type: string, enum: [json_pointer] }
        pointer:
          type: string
          minLength: 1
          maxLength: 256
          pattern: "^/"
          description: RFC 6901 pointer to a scalar request-body value.

    SystemSessionAffinityRule:
      type: object
      required:
        [name, enabled, api_formats, model_regex, key_sources, value_regex, ttl_seconds]
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        enabled: { type: boolean }
        api_formats:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [open_ai_chat_completions, open_ai_responses]
        model_regex:
          type: array
          maxItems: 8
          uniqueItems: true
          description: Empty means every model in the selected API formats.
          items: { type: string, minLength: 1, maxLength: 256 }
        key_sources:
          type: array
          minItems: 1
          maxItems: 8
          items: { $ref: "#/components/schemas/SystemSessionAffinityKeySource" }
        value_regex:
          type: string
          nullable: true
          minLength: 1
          maxLength: 256
        ttl_seconds:
          type: integer
          format: int64
          nullable: true
          minimum: 1
          maximum: 604800
          description: Null uses the system default.

    SystemSessionAffinitySettings:
      type: object
      required: [enabled, max_entries, default_ttl_seconds, rules]
      properties:
        enabled: { type: boolean, default: false }
        max_entries:
          type: integer
          minimum: 1
          maximum: 1000000
          default: 100000
        default_ttl_seconds:
          type: integer
          format: int64
          minimum: 1
          maximum: 604800
          default: 3600
        rules:
          type: array
          maxItems: 64
          items: { $ref: "#/components/schemas/SystemSessionAffinityRule" }

    SystemWebSocketSettings:
      type: object
      required:
        [enabled, max_idle_connections, idle_timeout_seconds, max_connection_age_seconds]
      properties:
        enabled:
          type: boolean
          default: false
          description: Global opt-in required before Responses WebSocket upgrades are accepted.
        max_idle_connections:
          type: integer
          minimum: 0
          maximum: 4096
          default: 128
          description: Process-wide maximum number of clean idle upstream WebSockets retained for reuse. Zero disables idle pooling.
        idle_timeout_seconds:
          type: integer
          format: int64
          minimum: 1
          maximum: 3600
          default: 300
        max_connection_age_seconds:
          type: integer
          format: int64
          minimum: 60
          maximum: 3600
          default: 3300
          description: Must be greater than idle_timeout_seconds.

    SystemSettingsInput:
      type: object
      required:
        [api_hosts, upstream, request_retry, passive_health, automatic_disable, scheduled_testing,
         session_affinity, websocket]
      properties:
        api_hosts:
          type: array
          maxItems: 32
          description: User-visible HTTP(S) base URLs for the OpenAI-compatible data plane.
          items:
