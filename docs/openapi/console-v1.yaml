components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    PathId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: { type: string }
      description: ETag from the preceding GET; stale values yield `409`.
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    RequestLogUserId:
      name: user_id
      in: query
      required: false
      description: Administrator-only owner filter.
      schema: { type: string, format: uuid }
    RequestLogApiKeyId:
      name: api_key_id
      in: query
      required: false
      schema: { type: string, format: uuid }
    RequestLogModel:
      name: model
      in: query
      required: false
      description: Exact client-model or upstream-model identifier.
      schema: { type: string, maxLength: 300 }
    RequestLogApiFormat:
      name: api_format
      in: query
      required: false
      schema: { $ref: "#/components/schemas/ApiFormat" }
    RequestLogOutcome:
      name: outcome
      in: query
      required: false
      schema:
        type: string
        enum: [succeeded, failed, rejected, cancelled]
    RequestLogStartedAfter:
      name: started_after
      in: query
      required: false
      schema: { $ref: "#/components/schemas/DateTime" }
    RequestLogStartedBefore:
      name: started_before
      in: query
      required: false
      schema: { $ref: "#/components/schemas/DateTime" }
    RequestLogBilled:
      name: billed
      in: query
      required: false
      schema: { type: boolean }
    StatisticsWindow:
      name: window
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/ChannelStatusWindow"
        default: 24h
    StatisticsStartedAfter:
      name: started_after
      in: query
      required: false
      description: Inclusive range start; defaults to seven days before the end.
      schema: { $ref: "#/components/schemas/DateTime" }
    StatisticsStartedBefore:
      name: started_before
      in: query
      required: false
      description: Exclusive range end; defaults to the current time.
      schema: { $ref: "#/components/schemas/DateTime" }
    StatisticsGranularity:
      name: granularity
      in: query
      required: false
      description: Hour supports at most 31 days; day supports at most 366 days.
      schema:
        $ref: "#/components/schemas/StatisticsGranularity"
        default: day
    StatisticsChannelId:
      name: channel_id
      in: query
      required: false
      description: Administrator-only exact channel filter.
      schema: { type: string, format: uuid }
    SessionAffinityRuleName:
      name: rule_name
      in: query
      required: false
      description: Exact session-affinity rule name. Omit to clear the whole cache.
      schema: { type: string, minLength: 1, maxLength: 64 }

  headers:
    ETag:
      description: Optimistic-concurrency version tag for `PUT` `If-Match`.
      schema: { type: string }

  responses:
    Unauthorized:
      description: Unauthorized.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    Forbidden:
      description: Forbidden.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    NotFound:
      description: Not found.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    Conflict:
      description: Optimistic-concurrency conflict or serializable retry.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    Unprocessable:
      description: Request rejected (validation).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    RateLimited:
      description: Too many authentication attempts.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    BadGateway:
      description: Upstream catalog operation rejected.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }

  schemas:
    ErrorBody:
      type: object
      required: [error]
      properties:
        error: { type: string }

    UserRole:
      type: string
      enum: [user, admin]
    ApiFormat:
      type: string
      enum: [open_ai_chat_completions, open_ai_responses]
    SelectionStrategy:
      type: string
      enum: [weighted_random, weighted_round_robin]
    UpstreamAuthKind:
      type: string
      enum: [none, bearer, header]
    ModelSyncAction:
      type: string
      enum: [price_update, import]
    ChannelStatusWindow:
      type: string
      enum: [24h, 3d, 7d]
    StatisticsGranularity:
      type: string
      enum: [hour, day]

    DateTime:
      type: string
      format: date-time
    Decimal:
      type: string
      description: rust_decimal::Decimal serialized as a string.
    DateTimeNullable:
      type: string
      format: date-time
      nullable: true
    DecimalNullable:
      type: string
      nullable: true
      description: rust_decimal::Decimal serialized as a string, or null.
    JsonValue:
      description: Arbitrary JSON; typed as `unknown`.
      # Empty schema => openapi-typescript emits `unknown`.

    ConsoleUser:
      type: object
      required: [id, email, display_name, role]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        display_name: { type: string }
        role: { $ref: "#/components/schemas/UserRole" }

    LoginResponse:
      type: object
      required: [access_token, token_type, expires_in, user]
      properties:
        access_token: { type: string }
        token_type: { type: string, enum: [Bearer] }
        expires_in: { type: integer }
        user: { $ref: "#/components/schemas/ConsoleUser" }

    ConsoleProfile:
      type: object
      required:
        [id, email, display_name, role, status, balance_amount, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, nullable: true }
        display_name: { type: string }
        role: { $ref: "#/components/schemas/UserRole" }
        status: { type: string }
        balance_amount:
          allOf: [{ $ref: "#/components/schemas/Decimal" }]
          description: Current account balance in USD.
        created_at: { $ref: "#/components/schemas/DateTime" }
        updated_at: { $ref: "#/components/schemas/DateTime" }

    ConsoleSession:
      type: object
      required: [id, created_at, last_seen_at, expires_at, revoked_at]
      properties:
        id: { type: string, format: uuid }
        created_at: { $ref: "#/components/schemas/DateTime" }
        last_seen_at: { $ref: "#/components/schemas/DateTimeNullable" }
        expires_at: { $ref: "#/components/schemas/DateTime" }
        revoked_at: { $ref: "#/components/schemas/DateTimeNullable" }

    InvitationResponse:
      type: object
      required: [id, user_id, invitation_token, expires_at, correlation_id]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        invitation_token: { type: string }
        expires_at: { $ref: "#/components/schemas/DateTime" }
        correlation_id: { type: string, format: uuid }

    MutationResponse:
      type: object
      required: [id, correlation_id]
      properties:
        id: { type: string, format: uuid }
        secret:
          type: string
          description: Created API key value; present only on API key create responses.
        correlation_id: { type: string, format: uuid }

    ReloadResponse:
      type: object
      required: [correlation_id]
      properties:
        correlation_id: { type: string, format: uuid }

    SystemUpstreamSettings:
      type: object
      required:
        [connect_timeout_seconds, response_header_timeout_seconds, stream_idle_timeout_seconds]
      properties:
        connect_timeout_seconds: { type: integer, format: int64, minimum: 1 }
        response_header_timeout_seconds: { type: integer, format: int64, minimum: 1 }
        stream_idle_timeout_seconds: { type: integer, format: int64, minimum: 1 }

    SystemRequestRetrySettings:
      type: object
      required: [enabled, max_retries]
      properties:
        enabled:
          type: boolean
          default: true
          description: Enables failover for connection failures, connect timeouts, and response-header timeouts.
        max_retries:
          type: integer
          minimum: 1
          maximum: 10
          default: 1
          description: Automatic retries after the initial distinct-channel attempt.

    SystemPassiveHealthSettings:
      type: object
      required: [connection_failure_threshold, cooldown_seconds]
      properties:
        connection_failure_threshold: { type: integer, minimum: 1 }
        cooldown_seconds: { type: integer, format: int64, minimum: 1 }

    SystemAutomaticDisableSettings:
      type: object
      required: [enabled, error_status_codes, error_message_keywords]
      properties:
        enabled:
          type: boolean
          description: Enables automatic temporary channel disablement for matching upstream errors.
        error_status_codes:
          type: array
          items: { type: integer, minimum: 100, maximum: 599 }
          description: Upstream HTTP statuses that trigger temporary disablement.
        error_message_keywords:
          type: array
          items: { type: string, minLength: 1, maxLength: 200 }
          description: Case-insensitive upstream error-message substrings that trigger temporary disablement.

    ScheduledTestingMode:
      type: string
      enum: [global, failure_only]

    SystemScheduledTestingSettings:
      type: object
      required: [mode, auto_recover, interval_minutes, prompt]
      properties:
        mode:
          allOf: [{ $ref: "#/components/schemas/ScheduledTestingMode" }]
          description: Global tests all enabled channels; failure_only tests only temporarily disabled channels.
        auto_recover:
          type: boolean
          description: Clears a temporary automatic disable after a successful scheduled test.
        interval_minutes: { type: integer, format: int64, minimum: 1, default: 5 }
        prompt:
          type: string
          minLength: 1
          maxLength: 4000
          default: "reply '1'"

    SystemSessionAffinityKeySource:
      oneOf:
        - $ref: "#/components/schemas/SystemSessionAffinityHeaderSource"
        - $ref: "#/components/schemas/SystemSessionAffinityJsonPointerSource"

    SystemSessionAffinityHeaderSource:
      type: object
      required: [type, name]
      properties:
        type: { type: string, enum: [request_header] }
        name:
          type: string
          minLength: 1
          maxLength: 256
          description: Non-sensitive request header used as an ordered affinity-key source.

    SystemSessionAffinityJsonPointerSource:
      type: object
      required: [type, pointer]
      properties:
        type: { type: string, enum: [json_pointer] }
        pointer:
          type: string
          minLength: 1
          maxLength: 256
          pattern: "^/"
          description: RFC 6901 pointer to a scalar request-body value.

    SystemSessionAffinityRule:
      type: object
      required:
        [name, enabled, api_formats, model_regex, key_sources, value_regex, ttl_seconds]
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        enabled: { type: boolean }
        api_formats:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: "#/components/schemas/ApiFormat" }
        model_regex:
          type: array
          maxItems: 8
          uniqueItems: true
          description: Empty means every model in the selected API formats.
          items: { type: string, minLength: 1, maxLength: 256 }
        key_sources:
          type: array
          minItems: 1
          maxItems: 8
          items: { $ref: "#/components/schemas/SystemSessionAffinityKeySource" }
        value_regex:
          type: string
          nullable: true
          minLength: 1
          maxLength: 256
        ttl_seconds:
          type: integer
          format: int64
          nullable: true
          minimum: 1
          maximum: 604800
          description: Null uses the system default.

    SystemSessionAffinitySettings:
      type: object
      required: [enabled, max_entries, default_ttl_seconds, rules]
      properties:
        enabled: { type: boolean, default: false }
        max_entries:
          type: integer
          minimum: 1
          maximum: 1000000
          default: 100000
        default_ttl_seconds:
          type: integer
          format: int64
          minimum: 1
          maximum: 604800
          default: 3600
        rules:
          type: array
          maxItems: 64
          items: { $ref: "#/components/schemas/SystemSessionAffinityRule" }

    SystemSettingsInput:
      type: object
      required:
        [api_hosts, upstream, request_retry, passive_health, automatic_disable, scheduled_testing, session_affinity]
      properties:
        api_hosts:
          type: array
          maxItems: 32
          description: User-visible HTTP(S) base URLs for the OpenAI-compatible data plane.
          items:
            type: string
            format: uri
            maxLength: 2048
        upstream: { $ref: "#/components/schemas/SystemUpstreamSettings" }
        request_retry: { $ref: "#/components/schemas/SystemRequestRetrySettings" }
        passive_health: { $ref: "#/components/schemas/SystemPassiveHealthSettings" }
        automatic_disable: { $ref: "#/components/schemas/SystemAutomaticDisableSettings" }
        scheduled_testing: { $ref: "#/components/schemas/SystemScheduledTestingSettings" }
        session_affinity: { $ref: "#/components/schemas/SystemSessionAffinitySettings" }

    SystemSettings:
      allOf:
        - $ref: "#/components/schemas/SystemSettingsInput"
        - type: object
          required: [updated_at]
          properties:
            updated_at: { $ref: "#/components/schemas/DateTime" }

    SessionAffinityRuleCache:
      type: object
      required: [name, entries]
      properties:
        name: { type: string }
        entries: { type: integer, format: int64, minimum: 0 }

    SessionAffinityCacheReport:
      type: object
      required: [enabled, max_entries, total_entries, rules]
      properties:
        enabled: { type: boolean }
        max_entries: { type: integer, format: int64, minimum: 0 }
        total_entries: { type: integer, format: int64, minimum: 0 }
        rules:
          type: array
          items: { $ref: "#/components/schemas/SessionAffinityRuleCache" }

    SessionAffinityCacheClearResponse:
      type: object
      required: [cleared_entries, cache]
      properties:
        cleared_entries: { type: integer, format: int64, minimum: 0 }
        cache: { $ref: "#/components/schemas/SessionAffinityCacheReport" }

    ApiHostsView:
      type: object
      required: [api_hosts]
      properties:
        api_hosts:
          type: array
          items:
            type: string
            format: uri

    SystemLoadReport:
      type: object
      required:
        [sampled_at, started_at, uptime_seconds, host, process, runtime,
         queues, request_log, database]
      properties:
        sampled_at: { $ref: "#/components/schemas/DateTime" }
        started_at: { $ref: "#/components/schemas/DateTime" }
        uptime_seconds: { type: integer, format: int64, minimum: 0 }
        host: { $ref: "#/components/schemas/SystemHostLoad" }
        process: { $ref: "#/components/schemas/SystemProcessLoad" }
        runtime: { $ref: "#/components/schemas/SystemRuntimeLoad" }
        queues: { $ref: "#/components/schemas/SystemQueuesLoad" }
        request_log: { $ref: "#/components/schemas/SystemRequestLogLoad" }
        database: { $ref: "#/components/schemas/SystemDatabaseLoad" }

    SystemHostLoad:
      type: object
      required:
        [logical_cpu_count, cpu_usage_percent, load_average_1m,
         load_average_5m, load_average_15m, memory_total_bytes,
         memory_used_bytes, memory_usage_percent]
      properties:
        logical_cpu_count: { type: integer, format: int64, minimum: 1 }
        cpu_usage_percent:
          type: number
          format: double
          minimum: 0
          maximum: 100
          nullable: true
        load_average_1m: { type: number, format: double, minimum: 0, nullable: true }
        load_average_5m: { type: number, format: double, minimum: 0, nullable: true }
        load_average_15m: { type: number, format: double, minimum: 0, nullable: true }
        memory_total_bytes: { type: integer, format: int64, minimum: 0, nullable: true }
        memory_used_bytes: { type: integer, format: int64, minimum: 0, nullable: true }
        memory_usage_percent:
          type: number
          format: double
          minimum: 0
          maximum: 100
          nullable: true

    SystemProcessLoad:
      type: object
      required:
        [cpu_usage_percent, resident_memory_bytes, resident_memory_percent,
         open_file_descriptors, threads]
      properties:
        cpu_usage_percent:
          type: number
          format: double
          minimum: 0
          maximum: 100
          nullable: true
          description: Gateway process share of total host CPU capacity.
        resident_memory_bytes: { type: integer, format: int64, minimum: 0, nullable: true }
        resident_memory_percent:
          type: number
          format: double
          minimum: 0
          maximum: 100
          nullable: true
        open_file_descriptors: { type: integer, format: int64, minimum: 0, nullable: true }
        threads: { type: integer, format: int64, minimum: 0, nullable: true }

    SystemRuntimeLoad:
      type: object
      required:
        [tracked_api_keys, requests_in_current_windows, in_flight_requests,
         routing_in_flight_requests, tracked_channels, cooling_down_channels,
         half_open_channels, session_affinity_entries]
      properties:
        tracked_api_keys: { type: integer, format: int64, minimum: 0 }
        requests_in_current_windows: { type: integer, format: int64, minimum: 0 }
        in_flight_requests: { type: integer, format: int64, minimum: 0 }
        routing_in_flight_requests: { type: integer, format: int64, minimum: 0 }
        tracked_channels: { type: integer, format: int64, minimum: 0 }
        cooling_down_channels: { type: integer, format: int64, minimum: 0 }
        half_open_channels: { type: integer, format: int64, minimum: 0 }
        session_affinity_entries: { type: integer, format: int64, minimum: 0 }

    SystemQueuesLoad:
      type: object
      required: [request_log_notifications, request_log_projection, automatic_disable]
      properties:
        request_log_notifications: { $ref: "#/components/schemas/SystemQueueLoad" }
        request_log_projection: { $ref: "#/components/schemas/SystemQueueLoad" }
        automatic_disable: { $ref: "#/components/schemas/SystemQueueLoad" }

    SystemQueueLoad:
      type: object
      required: [depth, capacity, utilization_percent]
      properties:
        depth: { type: integer, format: int64, minimum: 0 }
        capacity: { type: integer, format: int64, minimum: 0 }
        utilization_percent:
          type: number
          format: double
          minimum: 0
          maximum: 100
          nullable: true

    SystemRequestLogLoad:
      type: object
      required:
        [spool_pending_bytes, ingress_backlog_rows_estimate,
         ingress_oldest_age_seconds, settlement_backlog_rows,
         settlement_oldest_age_seconds, recorded_total, spooled_total,
         projected_rows_total, projection_deferred_total, settled_rows_total,
         spool_append_failures_total, ingress_failures_total,
         projection_failures_total, settlement_failures_total]
      properties:
        spool_pending_bytes: { type: integer, format: int64, minimum: 0 }
        ingress_backlog_rows_estimate:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        ingress_oldest_age_seconds:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        settlement_backlog_rows:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        settlement_oldest_age_seconds:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        recorded_total: { type: integer, format: int64, minimum: 0 }
        spooled_total: { type: integer, format: int64, minimum: 0 }
        projected_rows_total: { type: integer, format: int64, minimum: 0 }
        projection_deferred_total: { type: integer, format: int64, minimum: 0 }
        settled_rows_total: { type: integer, format: int64, minimum: 0 }
        spool_append_failures_total: { type: integer, format: int64, minimum: 0 }
        ingress_failures_total: { type: integer, format: int64, minimum: 0 }
        projection_failures_total: { type: integer, format: int64, minimum: 0 }
        settlement_failures_total: { type: integer, format: int64, minimum: 0 }

    SystemDatabaseLoad:
      type: object
      required: [control_plane, request_log]
      properties:
        control_plane: { $ref: "#/components/schemas/SystemDatabasePoolLoad" }
        request_log: { $ref: "#/components/schemas/SystemDatabasePoolLoad" }

    SystemDatabasePoolLoad:
      type: object
      required: [size, idle, in_use, capacity, utilization_percent]
      properties:
        size: { type: integer, format: int64, minimum: 0 }
        idle: { type: integer, format: int64, minimum: 0 }
        in_use: { type: integer, format: int64, minimum: 0 }
        capacity: { type: integer, format: int64, minimum: 0 }
        utilization_percent:
          type: number
          format: double
          minimum: 0
          maximum: 100
          nullable: true

    ApiKeyView:
      type: object
      required:
        [id, name, secret, status, expires_at, allowed_api_formats, permissions,
         allowed_group_ids, allowed_channel_ids, requests_per_minute, max_concurrent_requests,
         quota_limit_amount, quota_used_amount, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        secret:
          type: string
          description: Full API key value. Console clients must mask it by default.
        status: { type: string }
        expires_at: { $ref: "#/components/schemas/DateTimeNullable" }
        allowed_api_formats:
          type: array
          items: { $ref: "#/components/schemas/ApiFormat" }
        permissions:
          type: array
          items: { type: string }
        allowed_group_ids:
          type: array
          items: { type: string, format: uuid }
        allowed_channel_ids:
          type: array
          items: { type: string, format: uuid }
        requests_per_minute: { type: integer, nullable: true }
        max_concurrent_requests: { type: integer, nullable: true }
        quota_limit_amount: { $ref: "#/components/schemas/DecimalNullable" }
        quota_used_amount: { $ref: "#/components/schemas/Decimal" }
        created_at: { $ref: "#/components/schemas/DateTime" }
        updated_at: { $ref: "#/components/schemas/DateTime" }

    AdminApiKeyView:
      allOf:
        - $ref: "#/components/schemas/ApiKeyView"
        - type: object
          required: [user_id, user_status]
          properties:
            user_id: { type: string, format: uuid }
            user_status: { type: string }

    ApiKeyPolicyView:
      type: object
      required:
        [id, name, allowed_group_ids, allowed_channel_ids, enabled, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        allowed_group_ids:
          type: array
          items: { type: string, format: uuid }
        allowed_channel_ids:
          type: array
          items: { type: string, format: uuid }
        enabled: { type: boolean }
        created_at: { $ref: "#/components/schemas/DateTime" }
        updated_at: { $ref: "#/components/schemas/DateTime" }

    SelfApiKeyOptions:
      type: object
      required: [policy_id, policy_name, groups, channels]
      properties:
        policy_id: { type: string, format: uuid }
        policy_name: { type: string }
        groups:
          type: array
          items: { $ref: "#/components/schemas/SelfApiKeyGroupOption" }
        channels:
          type: array
          items: { $ref: "#/components/schemas/SelfApiKeyChannelOption" }

    SelfApiKeyGroupOption:
      type: object
      required: [id, name, api_format, enabled]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        api_format: { $ref: "#/components/schemas/ApiFormat" }
        enabled: { type: boolean }

    SelfApiKeyChannelOption:
      type: object
      required:
        [id, channel_group_id, channel_group_name, api_format, name, enabled, auto_disabled]
      properties:
        id: { type: string, format: uuid }
        channel_group_id: { type: string, format: uuid }
        channel_group_name: { type: string }
        api_format: { $ref: "#/components/schemas/ApiFormat" }
        name: { type: string }
        enabled: { type: boolean }
        auto_disabled: { type: boolean }

    ControlPlaneUser:
      type: object
      required:
        [id, email, display_name, role, status, can_reissue_invitation,
         default_api_key_policy_id,
         balance_amount, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, nullable: true }
        display_name: { type: string }
        role: { $ref: "#/components/schemas/UserRole" }
        status: { type: string }
        can_reissue_invitation:
          type: boolean
          description: |
            True when the account has no password and an administrator may
            safely replace its invitation.
        default_api_key_policy_id: { type: string, format: uuid, nullable: true }
        balance_amount:
          allOf: [{ $ref: "#/components/schemas/Decimal" }]
          description: Current account balance in USD.
        created_at: { $ref: "#/components/schemas/DateTime" }
        updated_at: { $ref: "#/components/schemas/DateTime" }

    ControlPlaneModel:
      type: object
      required:
        [id, source_model_id, display_name, provider_name, enabled,
         price_unit_tokens, input_unit_price, cached_input_unit_price,
         cache_write_unit_price, output_unit_price, price_effective_at,
         advanced_billing, last_synced_at, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        source_model_id: { type: string }
        display_name: { type: string }
        provider_name: { type: string, nullable: true }
        enabled: { type: boolean }
        price_unit_tokens: { type: integer }
        input_unit_price: { $ref: "#/components/schemas/Decimal" }
        cached_input_unit_price: { $ref: "#/components/schemas/Decimal" }
