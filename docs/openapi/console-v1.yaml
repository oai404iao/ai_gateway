      properties:
        id: { type: string, format: uuid }
        channel_group_id: { type: string, format: uuid }
        channel_group_name: { type: string }
        api_format: { $ref: "#/components/schemas/ApiFormat" }
        name: { type: string }
        enabled: { type: boolean }
        auto_disabled: { type: boolean }
        models:
          type: array
          items: { $ref: "#/components/schemas/ChannelStatusChannelModel" }

    ChannelStatusChannelModel:
      allOf:
        - $ref: "#/components/schemas/ChannelStatusModelMetric"
