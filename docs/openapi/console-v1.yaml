components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    PathId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: { type: string }
      description: ETag from the preceding GET; stale values yield `409`.
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    RequestLogUserId:
      name: user_id
      in: query
      required: false
      description: Administrator-only owner filter.
      schema: { type: string, format: uuid }
    RequestLogApiKeyId:
      name: api_key_id
      in: query
      required: false
      schema: { type: string, format: uuid }
    RequestLogModel:
      name: model
      in: query
      required: false
      description: Exact client-model or upstream-model identifier.
      schema: { type: string, maxLength: 300 }
    RequestLogApiFormat:
      name: api_format
      in: query
      required: false
      schema: { $ref: "#/components/schemas/ApiFormat" }
    RequestLogOutcome:
      name: outcome
      in: query
      required: false
      schema:
        type: string
        enum: [succeeded, failed, rejected, cancelled]
    RequestLogStartedAfter:
      name: started_after
      in: query
      required: false
      schema: { $ref: "#/components/schemas/DateTime" }
    RequestLogStartedBefore:
      name: started_before
      in: query
      required: false
      schema: { $ref: "#/components/schemas/DateTime" }
    RequestLogBilled:
      name: billed
      in: query
      required: false
      schema: { type: boolean }

  headers:
    ETag:
      description: Optimistic-concurrency version tag for `PUT` `If-Match`.
      schema: { type: string }

  responses:
    Unauthorized:
      description: Unauthorized.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    Forbidden:
      description: Forbidden.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    NotFound:
      description: Not found.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    Conflict:
      description: Optimistic-concurrency conflict or serializable retry.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    Unprocessable:
      description: Request rejected (validation).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    RateLimited:
      description: Too many authentication attempts.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    BadGateway:
      description: Upstream catalog operation rejected.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }

  schemas:
    ErrorBody:
      type: object
      required: [error]
      properties:
        error: { type: string }

    UserRole:
      type: string
      enum: [user, admin]
    ApiFormat:
      type: string
      enum: [open_ai_chat_completions, open_ai_responses]
    SelectionStrategy:
      type: string
      enum: [weighted_random, weighted_round_robin]
    UpstreamAuthKind:
      type: string
      enum: [bearer, header]
    ModelSyncAction:
      type: string
      enum: [price_update, import]

    DateTime:
      type: string
      format: date-time
    Decimal:
      type: string
      description: rust_decimal::Decimal serialized as a string.
    DateTimeNullable:
      type: string
      format: date-time
      nullable: true
    DecimalNullable:
      type: string
      nullable: true
      description: rust_decimal::Decimal serialized as a string, or null.
    JsonValue:
      description: Arbitrary JSON; typed as `unknown`.
      # Empty schema => openapi-typescript emits `unknown`.

    ConsoleUser:
      type: object
      required: [id, email, display_name, role]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        display_name: { type: string }
        role: { $ref: "#/components/schemas/UserRole" }

    LoginResponse:
      type: object
      required: [access_token, token_type, expires_in, user]
      properties:
        access_token: { type: string }
        token_type: { type: string, enum: [Bearer] }
        expires_in: { type: integer }
        user: { $ref: "#/components/schemas/ConsoleUser" }

    ConsoleProfile:
      type: object
      required:
        [id, email, display_name, role, status, balance_amount, currency, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, nullable: true }
        display_name: { type: string }
        role: { $ref: "#/components/schemas/UserRole" }
        status: { type: string }
        balance_amount: { $ref: "#/components/schemas/Decimal" }
        currency: { type: string }
        created_at: { $ref: "#/components/schemas/DateTime" }
        updated_at: { $ref: "#/components/schemas/DateTime" }

    ConsoleSession:
      type: object
      required: [id, created_at, last_seen_at, expires_at, revoked_at]
      properties:
        id: { type: string, format: uuid }
        created_at: { $ref: "#/components/schemas/DateTime" }
        last_seen_at: { $ref: "#/components/schemas/DateTimeNullable" }
        expires_at: { $ref: "#/components/schemas/DateTime" }
        revoked_at: { $ref: "#/components/schemas/DateTimeNullable" }

    InvitationResponse:
      type: object
      required: [id, user_id, invitation_token, expires_at, correlation_id]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        invitation_token: { type: string }
        expires_at: { $ref: "#/components/schemas/DateTime" }
        correlation_id: { type: string, format: uuid }

    MutationResponse:
      type: object
      required: [id, correlation_id]
      properties:
        id: { type: string, format: uuid }
        secret: { type: string, description: One-time secret; present only on create. }
        correlation_id: { type: string, format: uuid }

    ReloadResponse:
      type: object
      required: [correlation_id]
      properties:
        correlation_id: { type: string, format: uuid }

    ApiKeyView:
      type: object
      required:
        [id, name, status, expires_at, allowed_api_formats, permissions,
         allowed_group_ids, requests_per_minute, max_concurrent_requests,
         quota_limit_amount, quota_used_amount, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        status: { type: string }
        expires_at: { $ref: "#/components/schemas/DateTimeNullable" }
        allowed_api_formats:
          type: array
          items: { $ref: "#/components/schemas/ApiFormat" }
        permissions:
          type: array
          items: { type: string }
        allowed_group_ids:
          type: array
          nullable: true
          items: { type: string, format: uuid }
        requests_per_minute: { type: integer, nullable: true }
        max_concurrent_requests: { type: integer, nullable: true }
        quota_limit_amount: { $ref: "#/components/schemas/DecimalNullable" }
        quota_used_amount: { $ref: "#/components/schemas/Decimal" }
        created_at: { $ref: "#/components/schemas/DateTime" }
        updated_at: { $ref: "#/components/schemas/DateTime" }

    AdminApiKeyView:
      allOf:
        - $ref: "#/components/schemas/ApiKeyView"
        - type: object
          required: [user_id, user_status, tokens_per_minute]
          properties:
            user_id: { type: string, format: uuid }
            user_status: { type: string }
            tokens_per_minute: { type: integer, nullable: true }

    ApiKeyPolicyView:
      type: object
      required:
        [id, name, allowed_api_formats, permissions, allowed_group_ids,
         requests_per_minute, max_concurrent_requests, quota_limit_amount,
         max_active_keys, enabled, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        allowed_api_formats:
          type: array
          items: { $ref: "#/components/schemas/ApiFormat" }
        permissions:
          type: array
          items: { type: string }
        allowed_group_ids:
          type: array
          nullable: true
          items: { type: string, format: uuid }
        requests_per_minute: { type: integer, nullable: true }
        max_concurrent_requests: { type: integer, nullable: true }
        quota_limit_amount: { $ref: "#/components/schemas/DecimalNullable" }
        max_active_keys: { type: integer }
        enabled: { type: boolean }
        created_at: { $ref: "#/components/schemas/DateTime" }
        updated_at: { $ref: "#/components/schemas/DateTime" }

    ControlPlaneUser:
      type: object
      required:
        [id, email, display_name, role, status, default_api_key_policy_id,
         balance_amount, currency, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, nullable: true }
        display_name: { type: string }
        role: { $ref: "#/components/schemas/UserRole" }
        status: { type: string }
        default_api_key_policy_id: { type: string, format: uuid, nullable: true }
        balance_amount: { $ref: "#/components/schemas/Decimal" }
        currency: { type: string }
        created_at: { $ref: "#/components/schemas/DateTime" }
        updated_at: { $ref: "#/components/schemas/DateTime" }

    ControlPlaneModel:
      type: object
      required:
        [id, source_model_id, display_name, provider_name, enabled, currency,
         price_unit_tokens, input_unit_price, cached_input_unit_price,
         cache_write_unit_price, output_unit_price, price_effective_at,
         last_synced_at, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        source_model_id: { type: string }
        display_name: { type: string }
        provider_name: { type: string, nullable: true }
        enabled: { type: boolean }
        currency: { type: string }
        price_unit_tokens: { type: integer }
        input_unit_price: { $ref: "#/components/schemas/Decimal" }
        cached_input_unit_price: { $ref: "#/components/schemas/Decimal" }
        cache_write_unit_price: { $ref: "#/components/schemas/Decimal" }
        output_unit_price: { $ref: "#/components/schemas/Decimal" }
        price_effective_at: { $ref: "#/components/schemas/DateTime" }
        last_synced_at: { $ref: "#/components/schemas/DateTimeNullable" }
        created_at: { $ref: "#/components/schemas/DateTime" }
        updated_at: { $ref: "#/components/schemas/DateTime" }

    ChannelGroupView:
      type: object
      required: [id, name, api_format, priority, selection_strategy, enabled, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        api_format: { $ref: "#/components/schemas/ApiFormat" }
        priority: { type: integer }
        selection_strategy: { $ref: "#/components/schemas/SelectionStrategy" }
        enabled: { type: boolean }
        updated_at: { $ref: "#/components/schemas/DateTime" }

    ChannelView:
      type: object
      required:
        [id, channel_group_id, api_format, name, base_url, enabled,
         auto_disabled, auto_disabled_reason, weight, proxy_id,
         config_template_id, connect_timeout_ms, response_header_timeout_ms,
         stream_idle_timeout_ms, upstream_auth_kind, upstream_auth_header_name,
         upstream_credential_configured, available_models, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        channel_group_id: { type: string, format: uuid }
        api_format: { $ref: "#/components/schemas/ApiFormat" }
        name: { type: string }
        base_url: { type: string }
        enabled: { type: boolean }
        auto_disabled: { type: boolean }
        auto_disabled_reason: { type: string, nullable: true }
        weight: { type: integer }
        proxy_id: { type: string, format: uuid, nullable: true }
        config_template_id: { type: string, format: uuid, nullable: true }
        connect_timeout_ms: { type: integer, nullable: true }
        response_header_timeout_ms: { type: integer, nullable: true }
        stream_idle_timeout_ms: { type: integer, nullable: true }
