      type: object
      required: [long_context_tiers, request_multipliers]
      description: Model-level pricing rules. Long-context tiers replace base input/cache prices and optionally the output price at or above their threshold; all matching request multipliers are multiplied together and apply to the whole request cost.
      properties:
        long_context_tiers:
          type: array
          description: Strictly ascending input-token thresholds. A threshold selects the complete request's tier prices, including an optional output price.
          items: { $ref: "#/components/schemas/LongContextTier" }
        request_multipliers:
          type: array
          description: Exact JSON Pointer matches evaluated against the original client request body before request transforms.
          items: { $ref: "#/components/schemas/RequestBillingMultiplier" }

    LongContextTier:
      type: object
      required:
        [input_tokens_threshold, input_unit_price, cached_input_unit_price,
         cache_write_unit_price]
      properties:
        input_tokens_threshold:
          type: integer
          minimum: 1
          description: Applies when reported input tokens are greater than or equal to this value.
        input_unit_price: { $ref: "#/components/schemas/Decimal" }
        cached_input_unit_price: { $ref: "#/components/schemas/Decimal" }
        cache_write_unit_price: { $ref: "#/components/schemas/Decimal" }
        output_unit_price:
          allOf: [{ $ref: "#/components/schemas/Decimal" }]
          description: Optional for compatibility; when omitted, the base output price remains active for this tier.

    RequestBillingMultiplier:
      type: object
      required: [json_pointer, value, multiplier]
      properties:
        json_pointer:
          type: string
          maxLength: 512
          description: RFC 6901 JSON Pointer into the original client request body.
        value:
          allOf: [{ $ref: "#/components/schemas/JsonValue" }]
          description: Exact JSON value that activates this multiplier.
        multiplier:
          allOf: [{ $ref: "#/components/schemas/Decimal" }]
          description: Non-negative multiplier applied with every other matched request multiplier and the selected channel multiplier.

    ChannelGroupInput:
      type: object
      required: [name, api_format, priority, selection_strategy, enabled]
      properties:
        name: { type: string }
        api_format: { $ref: "#/components/schemas/ApiFormat" }
        priority: { type: integer, minimum: 0 }
        selection_strategy: { $ref: "#/components/schemas/SelectionStrategy" }
        enabled: { type: boolean }

    ChannelCreateInput:
      type: object
      required:
        [channel_group_id, api_format, name, base_url, enabled, weight, upstream_auth_kind]
      properties:
        channel_group_id: { type: string, format: uuid }
        api_format: { $ref: "#/components/schemas/ApiFormat" }
        name: { type: string }
        base_url:
          type: string
          format: uri
          description: HTTP(S) URL without embedded credentials, query, or fragment.
        enabled: { type: boolean }
        status_statistics_enabled:
          type: boolean
          default: false
          description: Includes this channel in the administrator channel-status report.
        auto_disable_allowed:
          type: boolean
          default: false
          description: Allows configured automatic-disable rules to temporarily remove this channel from routing.
        weight: { type: integer, minimum: 1 }
        billing_multiplier:
          allOf: [{ $ref: "#/components/schemas/Decimal" }]
          default: "1"
          description: Non-negative multiplier applied to upstream model prices for settlement.
        proxy_id: { type: string, format: uuid, nullable: true }
        config_template_id: { type: string, format: uuid, nullable: true }
        override_document: { $ref: "#/components/schemas/JsonValue" }
        connect_timeout_ms: { type: integer, minimum: 1, nullable: true }
        response_header_timeout_ms: { type: integer, minimum: 1, nullable: true }
        stream_idle_timeout_ms: { type: integer, minimum: 1, nullable: true }
        upstream_auth_kind: { $ref: "#/components/schemas/UpstreamAuthKind" }
        upstream_auth_header_name: { type: string, nullable: true }
        upstream_api_key: { type: string, nullable: true }
        available_models:
          type: array
          items: { type: string }
        test_model:
          type: string
          nullable: true
          description: Must be one of available_models when set.

    ChannelInput:
      type: object
      required:
        [channel_group_id, api_format, name, base_url, enabled, weight, upstream_auth_kind]
      properties:
        channel_group_id: { type: string, format: uuid }
        api_format: { $ref: "#/components/schemas/ApiFormat" }
        name: { type: string }
        base_url:
          type: string
          format: uri
          description: HTTP(S) URL without embedded credentials, query, or fragment.
        enabled: { type: boolean }
        status_statistics_enabled:
          type: boolean
          default: false
          description: Includes this channel in the administrator channel-status report.
        auto_disable_allowed:
          type: boolean
          default: false
          description: Allows configured automatic-disable rules to temporarily remove this channel from routing.
        weight: { type: integer, minimum: 1 }
        billing_multiplier:
          allOf: [{ $ref: "#/components/schemas/Decimal" }]
          description: Omit to preserve the stored non-negative billing multiplier.
        proxy_id: { type: string, format: uuid, nullable: true }
        config_template_id: { type: string, format: uuid, nullable: true }
        override_document:
          allOf: [{ $ref: "#/components/schemas/JsonValue" }]
          description: Omit to preserve the stored document; send `{}` to clear it.
        connect_timeout_ms: { type: integer, minimum: 1, nullable: true }
        response_header_timeout_ms: { type: integer, minimum: 1, nullable: true }
        stream_idle_timeout_ms: { type: integer, minimum: 1, nullable: true }
        upstream_auth_kind: { $ref: "#/components/schemas/UpstreamAuthKind" }
        upstream_auth_header_name: { type: string, nullable: true }
        upstream_api_key: { type: string, nullable: true }
        available_models:
          type: array
          items: { type: string }
        test_model:
          type: string
          nullable: true
          description: Must be one of available_models when set.

    ChannelModelDiscoveryInput:
      type: object
      required: [api_format, base_url, upstream_auth_kind]
      properties:
        api_format: { $ref: "#/components/schemas/ApiFormat" }
        base_url:
          type: string
