openapi: 3.0.3
info:
  title: AI Gateway Console API
  version: "1"
  description: |
    JWT-authenticated Console API for the AI Gateway. Served on a dedicated
    listener under `/console/v1/*`, separate from the OpenAI-compatible
    `/v1/*` data plane. `admin` is a `users.role` value, not a separate
    namespace or static bearer token.

    Conventions:
    - Decimals (`rust_decimal::Decimal`) and timestamps (`chrono::DateTime<Utc>`)
      serialize as RFC 3339 / decimal strings; all such fields are `string`.
    - All monetary balances, quotas, prices, request costs, and statistics are
      denominated and settled in USD. Currency is not a configurable field.
    - Most mutable resources return an `ETag` on detail `GET` and require
      `If-Match` on `PUT` for optimistic concurrency. A stale `If-Match`
      yields `409`.
    - API key values are retrievable by their owner and administrators; the
      Console masks them by default. Invitation tokens remain one-time values
      that are never retrievable again.
    - Every error body is `{"error":"<code>"}`.
    - `routing_dependency_invalid` means a mutation would make the routing
      graph invalid (for example, by leaving an enabled model rule without an
      eligible channel). Add or retain compatible enabled resources, or update
      the affected rule first.
    - `limit` query parameters are clamped to `1..=100` (default `50`).

    Compatibility aliases (same handlers, same JWT/role boundary, not
    duplicated below): `/console/v1/channel-groups`, `/channels`,
    `/model-rules`, `/proxies`, `/config-templates`, `/models/sync/preview`,
    `/models/sync/import`, and `/reload` mirror their `/routing`, `/network`,
    `/transforms`, `/catalog`, and `/system` counterparts. `/admin/v1/*` does
    not exist.
servers:
  - url: /console/v1
    description: Same-origin Console listener.
tags:
  - name: Auth
  - name: Self
  - name: Users
  - name: ApiKeyPolicies
  - name: ApiKeys
  - name: Models
  - name: Catalog
  - name: ChannelGroups
  - name: Channels
  - name: ModelRules
  - name: Proxies
  - name: Templates
  - name: RequestLogs
  - name: Statistics
  - name: AuditLogs
  - name: System

paths:
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginInput" }
      responses:
        "200":
          description: Session issued.
          headers:
            Set-Cookie:
              description: Rotating `__Host-ai_gateway_refresh` HttpOnly cookie.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refresh
      description: Refreshes the access token using the HttpOnly refresh cookie.
      responses:
        "200":
          description: Session rotated.
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/activate-invitation:
    post:
      tags: [Auth]
      operationId: activateInvitation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ActivateInvitationInput" }
      responses:
        "200":
          description: Account activated, session issued.
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Signed out; refresh cookie cleared. }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /me:
    get:
      tags: [Self]
      operationId: getMe
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsoleProfile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [Self]
      operationId: updateMe
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileUpdateInput" }
      responses:
        "200":
          description: Updated profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsoleProfile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /me/password:
    post:
      tags: [Self]
      operationId: changePassword
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordChangeInput" }
      responses:
        "204": { description: Password changed; all sessions revoked. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /me/sessions:
    get:
      tags: [Self]
      operationId: listSessions
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Sessions.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ConsoleSession" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /me/sessions/{id}:
    delete:
      tags: [Self]
      operationId: revokeSession
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "204": { description: Session revoked. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /me/api-keys:
    get:
      tags: [Self]
      operationId: listOwnApiKeys
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Own API keys.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ApiKeyView" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Self]
      operationId: createOwnApiKey
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SelfApiKeyCreateInput" }
      responses:
        "201":
          description: Key created; `secret` is also available from list/detail responses.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MutationResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422":
          description: Missing/disabled policy, invalid limits, or a target outside the policy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }

  /me/api-key-options:
    get:
      tags: [Self]
      operationId: getOwnApiKeyOptions
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Channel groups and channels selectable under the user's policy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SelfApiKeyOptions" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422":
          description: Missing or disabled default API key policy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }

  /me/api-keys/{id}:
    get:
      tags: [Self]
      operationId: getOwnApiKey
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: Key detail.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiKeyView" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Self]
      operationId: updateOwnApiKey
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/PathId"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SelfApiKeyUpdateInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MutationResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422":
          description: Invalid limits or a selected target outside the current policy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }

  /me/api-keys/{id}/revoke:
    post:
      tags: [Self]
      operationId: revokeOwnApiKey
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RevokeInput" }
      responses:
        "200":
          description: Revoked.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MutationResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /me/request-logs:
    get:
      tags: [Self, RequestLogs]
      operationId: listOwnRequestLogs
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/RequestLogApiKeyId"
        - $ref: "#/components/parameters/RequestLogModel"
        - $ref: "#/components/parameters/RequestLogApiFormat"
        - $ref: "#/components/parameters/RequestLogOutcome"
        - $ref: "#/components/parameters/RequestLogStartedAfter"
        - $ref: "#/components/parameters/RequestLogStartedBefore"
        - $ref: "#/components/parameters/RequestLogBilled"
      responses:
        "200":
          description: Own request logs.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RequestLogView" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /me/request-logs/{id}:
    get:
      tags: [Self, RequestLogs]
      operationId: getOwnRequestLog
      security: [{ bearerAuth: [] }]
      parameters:
