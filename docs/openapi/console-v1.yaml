openapi: 3.0.3
info:
  title: AI Gateway Console API
  version: "1"
  description: |
    JWT-authenticated Console API for the AI Gateway. Served on a dedicated
    listener under `/console/v1/*`, separate from the OpenAI-compatible
    `/v1/*` data plane. `admin` is a `users.role` value, not a separate
    namespace or static bearer token.

    Conventions:
    - Decimals (`rust_decimal::Decimal`) and timestamps (`chrono::DateTime<Utc>`)
      serialize as RFC 3339 / decimal strings; all such fields are `string`.
    - All monetary balances, quotas, prices, request costs, and statistics are
      denominated and settled in USD. Currency is not a configurable field.
    - Most mutable resources return an `ETag` on detail `GET` and require
      `If-Match` on `PUT` for optimistic concurrency. A stale `If-Match`
      yields `409`.
    - API key values are retrievable by their owner and administrators; the
      Console masks them by default. Per-user invitation tokens, temporary
      passwords, and reusable registration invitation code plaintext are
      returned only at issuance and are never retrievable again.
    - Every error body is `{"error":"<code>"}`.
    - `routing_dependency_invalid` means a mutation would make the routing
      graph structurally invalid (for example, by leaving an enabled model
      rule without any configured channel that supports its upstream model).
      Disabled and automatically disabled channels remain valid configured
      candidates but are excluded from active selection.
    - `limit` query parameters are clamped to `1..=100` (default `50`).

servers:
  - url: /console/v1
    description: Same-origin Console listener.
tags:
  - name: Auth
  - name: Self
  - name: Users
  - name: UserGroups
  - name: RegistrationInvitationCodes
  - name: ApiKeyPolicies
  - name: ApiKeys
  - name: Models
  - name: Catalog
  - name: ChannelGroups
  - name: Channels
  - name: ModelRules
  - name: CodexOAuth
  - name: Proxies
  - name: Templates
  - name: RequestLogs
  - name: Statistics
  - name: AuditLogs
  - name: System

paths:
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginInput" }
      responses:
        "200":
          description: |
            Session issued. An administrator-issued temporary password creates
            a password-change-only session whose `user.password_change_required`
            is true.
          headers:
            Set-Cookie:
              description: Rotating `__Host-ai_gateway_refresh` HttpOnly cookie.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /auth/register:
    post:
      tags: [Auth]
      operationId: register
      description: |
        Creates an active `user` account with a reusable registration
        invitation code. The code is matched case-sensitively after trimming
        surrounding whitespace. Its current user group and initial USD balance
        apply at registration time. A session is issued immediately.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterInput" }
      responses:
        "200":
          description: Account created and session issued.
          headers:
            Set-Cookie:
              description: Rotating `__Host-ai_gateway_refresh` HttpOnly cookie.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "409":
          description: The email already belongs to a Console account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        "422":
          description: Invalid input or unavailable registration invitation code.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refresh
      description: Refreshes the access token using the HttpOnly refresh cookie.
      responses:
        "200":
          description: Session rotated.
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/complete-password-reset:
    post:
      tags: [Auth]
      operationId: completePasswordReset
      description: |
        Replaces an unexpired administrator-issued temporary password with the
        user's chosen permanent password. Only a password-change session may
        call this endpoint. The temporary password and every restricted
        session are invalidated atomically, then a normal session is issued.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompletePasswordResetInput" }
      responses:
        "200":
          description: Password reset completed and a normal session issued.
          headers:
            Set-Cookie:
              description: New rotating `__Host-ai_gateway_refresh` HttpOnly cookie.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: The current session is not a password-change session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /auth/activate-invitation:
    post:
      tags: [Auth]
      operationId: activateInvitation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ActivateInvitationInput" }
      responses:
        "200":
          description: Account activated, session issued.
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Signed out; refresh cookie cleared. }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /me:
    get:
      tags: [Self]
      operationId: getMe
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsoleProfile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [Self]
      operationId: updateMe
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileUpdateInput" }
      responses:
        "200":
          description: Updated profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsoleProfile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /me/settings:
    get:
      tags: [Self]
      operationId: getUserSettings
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Current user forwarding preferences.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [Self]
      operationId: updateUserSettings
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserSettingsInput" }
      responses:
        "200":
          description: Updated user forwarding preferences.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /me/password:
    post:
      tags: [Self]
      operationId: changePassword
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordChangeInput" }
      responses:
        "204": { description: Password changed; all sessions revoked. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /me/sessions:
    get:
      tags: [Self]
      operationId: listSessions
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Current, active, expired, and revoked Console login sessions.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ConsoleSession" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [Self]
      operationId: revokeOtherSessions
      security: [{ bearerAuth: [] }]
      responses:
        "204":
          description: Every active session except the caller's current session was revoked.
        "401": { $ref: "#/components/responses/Unauthorized" }

  /me/sessions/{id}:
    delete:
      tags: [Self]
      operationId: revokeSession
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "204":
          description: Session revoked. Revoking the current session also clears its refresh cookie.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /me/api-keys:
    get:
      tags: [Self]
      operationId: listOwnApiKeys
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Own API keys.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ApiKeyView" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Self]
      operationId: createOwnApiKey
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SelfApiKeyCreateInput" }
      responses:
        "201":
          description: Key created; `secret` is also available from list/detail responses.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MutationResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422":
          description: Missing/disabled policy, invalid limits, or a target outside the policy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }

  /me/api-key-options:
    get:
      tags: [Self]
      operationId: getOwnApiKeyOptions
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Channel groups and channels selectable under the user's policy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SelfApiKeyOptions" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422":
          description: Missing or disabled default API key policy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }

  /me/api-hosts:
    get:
      tags: [Self]
      operationId: getApiHosts
      description: User-visible HTTP(S) base URLs configured by an administrator.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Configured API base URLs.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiHostsView" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /me/api-keys/{id}:
    get:
      tags: [Self]
      operationId: getOwnApiKey
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: Key detail.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiKeyView" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Self]
      operationId: updateOwnApiKey
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/PathId"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SelfApiKeyUpdateInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MutationResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422":
          description: Invalid limits or a selected target outside the current policy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }

  /me/api-keys/{id}/revoke:
    post:
      tags: [Self]
      operationId: revokeOwnApiKey
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RevokeInput" }
      responses:
        "200":
          description: Revoked.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MutationResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /me/request-logs:
    get:
      tags: [Self, RequestLogs]
      operationId: listOwnRequestLogs
      description: |
        Returns only request logs owned by the authenticated user. Concrete
        channel identity and the user display name are redacted for every
        self-service caller, including administrators.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/RequestLogApiKeyId"
        - $ref: "#/components/parameters/RequestLogModel"
        - $ref: "#/components/parameters/RequestLogApiFormat"
        - $ref: "#/components/parameters/RequestLogOutcome"
        - $ref: "#/components/parameters/RequestLogStartedAfter"
        - $ref: "#/components/parameters/RequestLogStartedBefore"
        - $ref: "#/components/parameters/RequestLogBilled"
      responses:
        "200":
          description: Owner-scoped request logs with self-service redaction.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RequestLogView" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /me/request-logs/{id}:
    get:
      tags: [Self, RequestLogs]
      operationId: getOwnRequestLog
      description: |
        Returns an owner-scoped request log. Concrete channel identity and the
        user display name are redacted for every self-service caller,
        including administrators.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: Log detail.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RequestLogView" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /me/usage:
    get:
      tags: [Self, Statistics]
      operationId: getOwnUsage
      description: |
        Returns a continuous 365-day UTC contribution calendar for the
        authenticated user, ending on the current UTC date. Only client
        requests participate; scheduled channel tests are excluded.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Personal request activity for the current user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PersonalUsageReport" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /me/codex-quotas:
    get:
      tags: [Self, CodexOAuth]
      operationId: listOwnCodexQuotas
      description: |
        Returns current quota-window snapshots for Codex credentials in the
        canonical Responses channel groups granted to the authenticated
        user's user group. Credential labels and account identity are never
        returned; `name` is the credential UUID string.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Read-only Codex quota snapshots visible to the current user.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SelfCodexQuotaCredentialView" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /me/codex-quotas/{id}/windows:
    get:
      tags: [Self, CodexOAuth]
      operationId: getOwnCodexQuotaWindowHistory
      description: |
        Returns read-only primary and secondary quota-window history only
        when the credential belongs to a Codex channel group granted through
        the authenticated user's user group. Hidden and missing credentials
        both return `404`.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/PathId"
        - $ref: "#/components/parameters/CodexQuotaHistoryLimit"
      responses:
        "200":
          description: Sanitized quota-window history visible to the current user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SelfCodexQuotaWindowHistory" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /users:
    get:
      tags: [Users]
      operationId: listUsers
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Users.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ControlPlaneUser" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Users]
      operationId: inviteUser
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InviteUserInput" }
      responses:
        "201":
          description: Invitation issued; `invitation_token` is shown only once.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitationResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /users/batch:
    post:
      tags: [Users]
      operationId: updateUsersBatch
      description: |
        Atomically applies the same partial changes to at most 100 users.
        Every item carries the `updated_at` value returned by the list API;
        one stale or invalid item rejects the complete batch.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserBatchUpdateInput" }
      responses:
        "200":
          description: Users updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserBatchUpdateResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /users/{id}:
    get:
      tags: [Users]
      operationId: getUser
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: User detail.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ControlPlaneUser" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Users]
      operationId: replaceUser
      deprecated: true
      description: |
        Compatibility full-resource update. New clients should use `PATCH`,
        which preserves every omitted field.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/PathId"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MutationResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    delete:
      tags: [Users]
      operationId: deleteUser
      description: |
        Irreversibly anonymizes the user, revokes every session, invitation,
        and API key, and hides the account from management lists. Request logs
        and audit history retain their user id. Administrators cannot delete
        their own account.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/PathId"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: User anonymized.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MutationResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    patch:
      tags: [Users]
      operationId: updateUser
      description: |
        Partially updates one user. Omitted fields retain their current values.
        An `invited` account remains pending until the invitation holder
        activates it; administrators cannot mark an invitation active through
        this endpoint.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/PathId"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserUpdateInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MutationResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /users/{id}/invitation:
    post:
      tags: [Users]
      operationId: reissueUserInvitation
      description: |
        Replaces every unaccepted invitation for a user who has never set a
        password. The user returns to `invited`, previous invitation tokens are
        revoked, and a new one-time token is returned.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "201":
          description: Replacement invitation issued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitationResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /users/{id}/temporary-password:
    post:
      tags: [Users]
      operationId: issueTemporaryPassword
      description: |
        Generates a server-chosen temporary password, valid for 24 hours, for
        an active user who already has a password. The administrator must
        re-enter their own current password. Issuance immediately replaces the
        target's previous password, revokes every Console session, and requires
        a password change before any ordinary Console resource can be accessed.
        Reissuing invalidates the previous temporary password. Invited users
        must use the invitation recovery flow instead.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TemporaryPasswordInput" }
      responses:
        "201":
          description: Temporary password issued; plaintext is shown only once.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemporaryPasswordResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Administrator reauthentication failed or the actor is not an administrator.
          content:
            application/json:
