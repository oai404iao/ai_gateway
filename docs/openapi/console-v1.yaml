components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    PathId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: { type: string }
      description: ETag from the preceding GET; stale values yield `409`.
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    RequestLogUserId:
      name: user_id
      in: query
      required: false
      description: Administrator-only owner filter.
      schema: { type: string, format: uuid }
    RequestLogApiKeyId:
      name: api_key_id
      in: query
      required: false
      schema: { type: string, format: uuid }
    RequestLogModel:
      name: model
      in: query
      required: false
      description: Exact client-model or upstream-model identifier.
      schema: { type: string, maxLength: 300 }
    RequestLogApiFormat:
      name: api_format
      in: query
      required: false
      schema: { $ref: "#/components/schemas/ApiFormat" }
    RequestLogOutcome:
      name: outcome
      in: query
      required: false
      schema:
        type: string
        enum: [succeeded, failed, rejected, cancelled]
    RequestLogStartedAfter:
      name: started_after
      in: query
      required: false
      schema: { $ref: "#/components/schemas/DateTime" }
    RequestLogStartedBefore:
      name: started_before
      in: query
      required: false
      schema: { $ref: "#/components/schemas/DateTime" }
    RequestLogBilled:
      name: billed
      in: query
      required: false
      schema: { type: boolean }
    StatisticsWindow:
      name: window
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/ChannelStatusWindow"
        default: 24h
    StatisticsStartedAfter:
      name: started_after
      in: query
      required: false
      description: Inclusive range start; defaults to seven days before the end.
      schema: { $ref: "#/components/schemas/DateTime" }
    StatisticsStartedBefore:
      name: started_before
      in: query
      required: false
      description: Exclusive range end; defaults to the current time.
      schema: { $ref: "#/components/schemas/DateTime" }
    StatisticsGranularity:
      name: granularity
      in: query
      required: false
      description: Hour supports at most 31 days; day supports at most 366 days.
      schema:
        $ref: "#/components/schemas/StatisticsGranularity"
        default: day

  headers:
    ETag:
      description: Optimistic-concurrency version tag for `PUT` `If-Match`.
      schema: { type: string }

  responses:
    Unauthorized:
      description: Unauthorized.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    Forbidden:
      description: Forbidden.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    NotFound:
      description: Not found.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    Conflict:
      description: Optimistic-concurrency conflict or serializable retry.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    Unprocessable:
      description: Request rejected (validation).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    RateLimited:
      description: Too many authentication attempts.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    BadGateway:
      description: Upstream catalog operation rejected.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }

  schemas:
    ErrorBody:
      type: object
      required: [error]
      properties:
        error: { type: string }

    UserRole:
      type: string
      enum: [user, admin]
    ApiFormat:
      type: string
      enum: [open_ai_chat_completions, open_ai_responses]
    SelectionStrategy:
      type: string
      enum: [weighted_random, weighted_round_robin]
    UpstreamAuthKind:
      type: string
      enum: [none, bearer, header]
    ModelSyncAction:
      type: string
      enum: [price_update, import]
    ChannelStatusWindow:
      type: string
      enum: [24h, 3d, 7d]
    StatisticsGranularity:
      type: string
      enum: [hour, day]

    DateTime:
      type: string
      format: date-time
    Decimal:
      type: string
      description: rust_decimal::Decimal serialized as a string.
    DateTimeNullable:
      type: string
      format: date-time
      nullable: true
    DecimalNullable:
      type: string
      nullable: true
      description: rust_decimal::Decimal serialized as a string, or null.
    JsonValue:
      description: Arbitrary JSON; typed as `unknown`.
      # Empty schema => openapi-typescript emits `unknown`.

    ConsoleUser:
      type: object
      required: [id, email, display_name, role]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        display_name: { type: string }
        role: { $ref: "#/components/schemas/UserRole" }

    LoginResponse:
      type: object
      required: [access_token, token_type, expires_in, user]
      properties:
        access_token: { type: string }
        token_type: { type: string, enum: [Bearer] }
        expires_in: { type: integer }
        user: { $ref: "#/components/schemas/ConsoleUser" }

    ConsoleProfile:
      type: object
      required:
        [id, email, display_name, role, status, balance_amount, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, nullable: true }
        display_name: { type: string }
        role: { $ref: "#/components/schemas/UserRole" }
        status: { type: string }
        balance_amount:
          allOf: [{ $ref: "#/components/schemas/Decimal" }]
          description: Current account balance in USD.
        created_at: { $ref: "#/components/schemas/DateTime" }
        updated_at: { $ref: "#/components/schemas/DateTime" }

    ConsoleSession:
      type: object
      required: [id, created_at, last_seen_at, expires_at, revoked_at]
      properties:
        id: { type: string, format: uuid }
        created_at: { $ref: "#/components/schemas/DateTime" }
        last_seen_at: { $ref: "#/components/schemas/DateTimeNullable" }
        expires_at: { $ref: "#/components/schemas/DateTime" }
        revoked_at: { $ref: "#/components/schemas/DateTimeNullable" }

    InvitationResponse:
      type: object
      required: [id, user_id, invitation_token, expires_at, correlation_id]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        invitation_token: { type: string }
        expires_at: { $ref: "#/components/schemas/DateTime" }
        correlation_id: { type: string, format: uuid }

    MutationResponse:
      type: object
      required: [id, correlation_id]
      properties:
        id: { type: string, format: uuid }
        secret:
          type: string
          description: Created API key value; present only on API key create responses.
        correlation_id: { type: string, format: uuid }

    ReloadResponse:
      type: object
      required: [correlation_id]
      properties:
        correlation_id: { type: string, format: uuid }

    SystemUpstreamSettings:
      type: object
      required:
        [connect_timeout_seconds, response_header_timeout_seconds, stream_idle_timeout_seconds]
      properties:
        connect_timeout_seconds: { type: integer, format: int64, minimum: 1 }
        response_header_timeout_seconds: { type: integer, format: int64, minimum: 1 }
        stream_idle_timeout_seconds: { type: integer, format: int64, minimum: 1 }

    SystemRequestRetrySettings:
      type: object
      required: [enabled, max_retries]
      properties:
        enabled:
          type: boolean
          default: true
          description: Enables failover for connection failures, connect timeouts, and response-header timeouts.
        max_retries:
          type: integer
          minimum: 1
          maximum: 10
          default: 1
          description: Automatic retries after the initial distinct-channel attempt.

    SystemPassiveHealthSettings:
      type: object
      required: [connection_failure_threshold, cooldown_seconds]
      properties:
        connection_failure_threshold: { type: integer, minimum: 1 }
        cooldown_seconds: { type: integer, format: int64, minimum: 1 }

    SystemAutomaticDisableSettings:
      type: object
      required: [enabled, error_status_codes, error_message_keywords]
      properties:
        enabled:
          type: boolean
          description: Enables automatic temporary channel disablement for matching upstream errors.
        error_status_codes:
          type: array
          items: { type: integer, minimum: 100, maximum: 599 }
          description: Upstream HTTP statuses that trigger temporary disablement.
        error_message_keywords:
          type: array
          items: { type: string, minLength: 1, maxLength: 200 }
          description: Case-insensitive upstream error-message substrings that trigger temporary disablement.

    ScheduledTestingMode:
      type: string
      enum: [global, failure_only]

    SystemScheduledTestingSettings:
      type: object
      required: [mode, auto_recover, interval_minutes, prompt]
      properties:
        mode:
          allOf: [{ $ref: "#/components/schemas/ScheduledTestingMode" }]
          description: Global tests all enabled channels; failure_only tests only temporarily disabled channels.
        auto_recover:
          type: boolean
          description: Clears a temporary automatic disable after a successful scheduled test.
        interval_minutes: { type: integer, format: int64, minimum: 1, default: 5 }
        prompt:
          type: string
          minLength: 1
          maxLength: 4000
          default: "reply '1'"

    SystemSessionAffinityKeySource:
      oneOf:
        - $ref: "#/components/schemas/SystemSessionAffinityHeaderSource"
        - $ref: "#/components/schemas/SystemSessionAffinityJsonPointerSource"

    SystemSessionAffinityHeaderSource:
      type: object
      required: [type, name]
      properties:
        type: { type: string, enum: [request_header] }
        name:
          type: string
          minLength: 1
          maxLength: 256
          description: Non-sensitive request header used as an ordered affinity-key source.

    SystemSessionAffinityJsonPointerSource:
      type: object
      required: [type, pointer]
      properties:
        type: { type: string, enum: [json_pointer] }
        pointer:
          type: string
          minLength: 1
          maxLength: 256
          pattern: "^/"
          description: RFC 6901 pointer to a scalar request-body value.

    SystemSessionAffinityRule:
      type: object
      required:
        [name, enabled, api_formats, model_regex, key_sources, value_regex, ttl_seconds]
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        enabled: { type: boolean }
        api_formats:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: "#/components/schemas/ApiFormat" }
        model_regex:
          type: array
          maxItems: 8
          uniqueItems: true
          description: Empty means every model in the selected API formats.
          items: { type: string, minLength: 1, maxLength: 256 }
        key_sources:
          type: array
          minItems: 1
          maxItems: 8
          items: { $ref: "#/components/schemas/SystemSessionAffinityKeySource" }
        value_regex:
          type: string
          nullable: true
          minLength: 1
          maxLength: 256
        ttl_seconds:
          type: integer
          format: int64
          nullable: true
          minimum: 1
          maximum: 604800
          description: Null uses the system default.

    SystemSessionAffinitySettings:
      type: object
      required: [enabled, max_entries, default_ttl_seconds, rules]
      properties:
        enabled: { type: boolean, default: false }
        max_entries:
          type: integer
          minimum: 1
          maximum: 1000000
          default: 100000
        default_ttl_seconds:
          type: integer
          format: int64
          minimum: 1
          maximum: 604800
          default: 3600
        rules:
          type: array
          maxItems: 64
          items: { $ref: "#/components/schemas/SystemSessionAffinityRule" }

