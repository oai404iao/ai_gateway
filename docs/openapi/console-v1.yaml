          required: [history]
          properties:
            history:
              type: array
              items: { $ref: "#/components/schemas/ChannelStatusBucket" }

    ChannelStatusBucket:
      type: object
      required: [started_at, request_count, success_rate, p90_ttft_ms, p50_tps]
      properties:
        started_at: { $ref: "#/components/schemas/DateTime" }
        request_count: { type: integer }
        success_rate:
          type: number
          format: double
          minimum: 0
          maximum: 1
          nullable: true
          description: Successful requests divided by non-cancelled terminal requests.
        p90_ttft_ms:
          type: number
          format: double
          minimum: 0
          nullable: true
        p50_tps:
          type: number
          format: double
          minimum: 0
          nullable: true

    CostStatisticsReport:
      type: object
      required: [started_at, ended_at, granularity, summary, buckets, models, channels]
      properties:
        started_at: { $ref: "#/components/schemas/DateTime" }
        ended_at: { $ref: "#/components/schemas/DateTime" }
        granularity: { $ref: "#/components/schemas/StatisticsGranularity" }
        summary: { $ref: "#/components/schemas/CostStatisticsSummary" }
        buckets:
          type: array
          description: Continuous UTC buckets covering the selected range, including empty buckets.
          items: { $ref: "#/components/schemas/CostStatisticsBucket" }
        models:
          type: array
          items: { $ref: "#/components/schemas/CostStatisticsModel" }
        channels:
          type: array
          description: Administrator-only channel breakdown; empty for regular users.
          items: { $ref: "#/components/schemas/CostStatisticsChannel" }

    CostStatisticsSummary:
      type: object
      required:
        [request_count, priced_request_count, total_tokens, input_tokens,
