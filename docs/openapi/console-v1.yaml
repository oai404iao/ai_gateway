            schema: { $ref: "#/components/schemas/ModelSyncPreviewRequest" }
      responses:
        "200":
          description: Preview.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelSyncPreview" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "502": { $ref: "#/components/responses/BadGateway" }

  /catalog/models/import:
    post:
      tags: [Catalog]
      operationId: applyCatalogModels
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModelImportRequest" }
      responses:
        "200":
          description: Selected catalog models imported or price-refreshed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelImportResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "502": { $ref: "#/components/responses/BadGateway" }

  /api-keys:
    get:
      tags: [ApiKeys]
      operationId: listApiKeys
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: All API keys.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminApiKeyView" }
