[package]
name = "ai-gateway"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "High-performance LLM request forwarding gateway"
license = "UNLICENSED"

[dependencies]
arc-swap = "1.7"
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
rust_decimal = { version = "1.36", features = ["serde"] }
secrecy = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio-rustls", "migrate", "chrono", "uuid", "json", "rust_decimal"] }
subtle = "2.6"
thiserror = "2.0"
tokio = { version = "1.43", features = ["macros", "net", "rt-multi-thread"] }
toml = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
zeroize = { version = "1.8", features = ["derive"] }
