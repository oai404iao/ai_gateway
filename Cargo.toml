[package]
name = "ai-gateway"
version = "0.6.2"
edition = "2024"
rust-version = "1.92"
description = "High-performance LLM request forwarding gateway"
license = "AGPL-3.0-only"
repository = "https://github.com/oai404iao/ai_gateway"

[features]
# Embeds the built `web/console/dist` static assets into the binary and serves
# them from the Console listener when `[console].ui_enabled` is set. Building
# with this feature requires `pnpm --dir web/console build` to have produced
# `web/console/dist` first.
embedded-console-ui = ["dep:rust-embed", "dep:mime_guess"]

[dependencies]
arc-swap = "1.7"
argon2 = { version = "0.5", features = ["password-hash"] }
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
bytes = "1.10"
chrono = { version = "0.4", features = ["serde"] }
crc32fast = "1.4"
fs2 = "0.4"
futures-util = "0.3"
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server-auto", "server-graceful", "service", "tokio"] }
http-body-util = "0.1"
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto", "use_pem"] }
json-patch = "4.2"
jsonptr = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "socks", "stream"] }
regex = "1.11"
rand = "0.9"
rust_decimal = { version = "1.36", features = ["serde"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
secrecy = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio-rustls", "migrate", "chrono", "uuid", "json", "rust_decimal", "macros"] }
subtle = "2.6"
thiserror = "2.0"
time = "=0.3.54"
tokio = { version = "1.43", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-socks = "0.5"
# Codex negotiates permessage-deflate for Responses WebSocket connections.
# These SHA-pinned OpenAI forks add RFC 7692 support that is not available in
# the corresponding crates.io tungstenite release.
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "0e5b2d73aa18dd9f0a50ee9ff199d5aef7594186", features = ["rustls-tls-webpki-roots"] }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f", features = ["deflate"] }
toml = "1.1"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["cors", "limit", "trace"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
webpki-roots = "1"
zeroize = { version = "1.8", features = ["derive"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
urlencoding = "2.1"
rust-embed = { version = "8", optional = true }
mime_guess = { version = "2", optional = true }

[workspace]
members = [".", "tools/forwarding-perf"]
default-members = ["."]
resolver = "3"
