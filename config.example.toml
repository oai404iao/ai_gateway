# Copy this file to ./config.toml when creating an environment-specific setup.
# Do not use a .env file; the application loads TOML configuration directly.

[server]
host = "127.0.0.1"
port = 3000
# After this deadline, in-flight responses are cancelled during shutdown.
shutdown_grace_period_seconds = 30

[request_limits]
# OpenAI-compatible proxy request bodies.
proxy_body_bytes = 1_048_576
# Console management payloads such as model and route updates.
console_body_bytes = 262_144
# Login, refresh, password, and invitation payloads.
auth_body_bytes = 16_384

[database]
url = "postgres://ai_gateway:ai_gateway@127.0.0.1:5432/ai_gateway"
max_connections = 10
connect_timeout_seconds = 5

[upstream]
connect_timeout_seconds = 10
response_header_timeout_seconds = 30
stream_idle_timeout_seconds = 90

[runtime_config]
reload_interval_seconds = 30

[request_logging]
# Accepted logs are persisted asynchronously; a full queue drops the log only.
queue_capacity = 1_024

[passive_health]
# Only pre-header connection failures count. After three failures, one probe is
# admitted after this cooldown; response headers reset the passive breaker.
connection_failure_threshold = 3
cooldown_seconds = 30

[models_sync]
# Administrator-triggered models.dev catalog import. Only complete USD
# input/output prices are eligible for preview and synchronization.
api_url = "https://models.dev/api.json"
request_timeout_seconds = 15
max_response_bytes = 10_485_760
max_model_metadata_bytes = 65_536
max_selections = 100

# The Console API is a separate listener. It is intended to sit behind an
# HTTPS reverse proxy; JWT signing material stays in protected files, never in
# this TOML. Administrator is a user role, not an alternate static token.
[console]
enabled = false
# host = "127.0.0.1"
# port = 3001
# allowed_origins = ["https://console.example.com"]

# [auth]
# issuer = "ai-gateway"
# audience = "ai-gateway-console"
# access_token_ttl_seconds = 900
# refresh_token_ttl_seconds = 2_592_000
# key_id = "primary-2026"
# signing_key_path = "./console-jwt-private.pem"
# verification_key_path = "./console-jwt-public.pem"

[observability]
filter = "ai_gateway=debug,tower_http=info"

# API keys, models, routing rules, groups, channels, and upstream credentials
# are loaded only from PostgreSQL into immutable runtime snapshots. TOML is
# bootstrap configuration only; dynamic [[api_keys]], [[channels]], and
# [[model_rules]] tables are intentionally rejected.
